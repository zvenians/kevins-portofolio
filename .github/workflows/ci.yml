name: Workspace Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Source and behavior tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        run: |
          npm ci
          npm ci --prefix apps-script
      - name: Run unit and integration tests
        run: npm test
      - name: Check source code
        run: npm run lint
