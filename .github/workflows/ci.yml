name: Workspace Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Source and behavior tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: |
          npm ci
          npm ci --prefix apps-script
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix apps-script --audit-level=high
      - name: Build source-backed public assets
        run: |
          node apps-script/build.mjs
          node vercel-site/sync.mjs
      - name: Verify generated assets are committed
        run: git diff --exit-code
      - name: Build the deployed Vercel frontend
        run: npm --prefix vercel-site run build
      - name: Run unit and integration tests
        run: npm test
      - name: Check source code
        run: npm run lint
