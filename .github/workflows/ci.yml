name: Workspace Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Source and behavior tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: |
          npm ci
          npm ci --prefix apps-script
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix apps-script --audit-level=high
      - name: Build source-backed public assets
        run: |
          node apps-script/build.mjs
          node vercel-site/sync.mjs
      - name: Verify generated assets match committed source
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated assets differ from the committed source. Run node apps-script/build.mjs and node vercel-site/sync.mjs, then commit their outputs."
            git diff --name-only
            exit 1
          fi
          if git status --porcelain --untracked-files=all | grep -E 'vercel-site/public/assets/portfolio-[a-f0-9]{12}\\.(css|js)' ; then
            echo "::error::Untracked generated bundles detected. Commit the generated public assets."
            exit 1
          fi
      - name: Build the deployed Vercel frontend
        run: npm --prefix vercel-site run build
      - name: Run unit and integration tests
        run: npm test
      - name: Check source code
        run: npm run lint
