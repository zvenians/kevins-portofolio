name: Workspace Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Source and behavior tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: |
          npm ci
          npm ci --prefix apps-script
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix apps-script --audit-level=high
      - name: Build source-backed public assets
        run: |
          node apps-script/build.mjs
          node vercel-site/sync.mjs
      - name: Export generated changes for one-time source synchronization
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { gzipSync } from 'node:zlib';
          import { execFileSync } from 'node:child_process';
          const changes = execFileSync('git', ['status', '--porcelain', '-z', '--untracked-files=all'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          for (const change of changes) {
            const status = change.slice(0,2), file = change.slice(3);
            if (!/^(apps-script\/(?:Code\.gs|preview\/index\.html)|vercel-site\/generated\/(?:template\.ts|fallback\.json)|vercel-site\/public\/assets\/portfolio-[a-f0-9]{12}\.(?:js|css))$/.test(file)) continue;
            if (status.includes('D')) { console.log('SYNC_DELETE:'+file); continue; }
            const data = gzipSync(readFileSync(file), { level: 9 }).toString('base64');
            const parts = data.match(/.{1,1500}/g) || [];
            parts.forEach((part, i) => console.log('SYNC_BLOB:'+file+':'+(i+1)+'/'+parts.length+':'+part));
          }
          NODE
      - name: Build the deployed Vercel frontend
        run: npm --prefix vercel-site run build
      - name: Run unit and integration tests
        run: npm test
      - name: Check source code
        run: npm run lint
