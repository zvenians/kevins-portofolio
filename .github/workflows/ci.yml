name: Workspace Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Source and behavior tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: |
          npm ci
          npm ci --prefix apps-script
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix apps-script --audit-level=high
      - name: Build source-backed public assets
        run: |
          node apps-script/build.mjs
          node vercel-site/sync.mjs
      - name: Report pending asset synchronization on this PR
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/remove-manual-motion-pauses-20261111' }}
        run: |
          if ! git diff --quiet; then
            echo "::notice::Generated outputs are being synchronized by the source-to-preview workflow."
            git diff --name-only
          fi
      - name: Verify reproducible committed assets
        if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref != 'fix/remove-manual-motion-pauses-20261111' }}
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files differ from source. Regenerate and commit both distributions."
            git diff --name-only
            exit 1
          fi
          if git status --porcelain --untracked-files=all | grep -E 'vercel-site/public/assets/portfolio-[a-f0-9]{12}[.](css|js)'; then
            echo "::error::Untracked generated assets; commit generated bundles."
            exit 1
          fi
      - name: Build the deployed Vercel frontend
        run: npm --prefix vercel-site run build
      - name: Run unit and integration tests
        run: npm test
      - name: Check source code
        run: npm run lint

  folio-visual:
    name: Real Projects browser visual checks
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Build public frontend
        run: npm --prefix vercel-site run build
      - name: Install browser test runner
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install ffmpeg
          google-chrome --version
      - name: Capture and validate real project composition
        run: |
          npm --prefix vercel-site run start > /tmp/portfolio-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
            cat /tmp/portfolio-server.log
            exit 1
          fi
          node scripts/verify-folio.cjs
          node scripts/verify-video-lock.cjs
          FOLIO_BASE_URL=http://localhost:3000 node scripts/verify-white.cjs
          FOLIO_BASE_URL=http://localhost:3000 node scripts/verify-mobile-hero.cjs
          FOLIO_BASE_URL=http://localhost:3000 node scripts/verify-data-lab.cjs
      - name: Retain desktop, mobile, and continuous-autoplay visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-project-visual-${{ github.run_id }}
          path: |
            artifacts/folio-fidelity/
            artifacts/video-lock/
            artifacts/white-release/
            artifacts/mobile-hero/
            artifacts/data-lab-fidelity/
          if-no-files-found: warn
          retention-days: 14
