<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruang Rawat | Demo Studio</title><link rel="stylesheet" href="edisi.css"><link rel="stylesheet" href="workspace.css"><script defer src="common.js"></script><script defer src="care.js"></script></head><body class="care"><header><strong>Ruang Rawat</strong><nav aria-label="Navigasi layanan"><a href="#perawat">Kenali perawat</a><a href="/studio">Demo Studio</a></nav></header><main><div class="mast"><div><small>Ruang Rawat / Kunjungan rumah</small><h1>Jadwalkan perawat.</h1></div></div><form id="form" class="work"><div><section class="sheet" id="perawat"><h2>1. Pilih perawat</h2><p>Bandingkan fokus pendampingan sebelum memilih.</p><div id="people" class="portraits"></div><button class="primary" id="continue" type="button">Lanjut ke jadwal</button></section><section class="sheet" id="kunjungan" hidden><h2 tabindex="-1">2. Detail kunjungan</h2><div id="options" class="fields"></div><label>Alamat kunjungan<input required maxlength="180" id="addressField" placeholder="Jalan, nomor rumah, kelurahan"></label><div class="fields"><label>Tanggal<input required type="date" id="day"></label><label>Jam (WITA)<input required type="time" id="hour" value="10:00"></label></div><button type="button" id="back">Ganti perawat</button> <button class="primary">Konfirmasi kunjungan demo</button></section></div><aside><small>Ringkasan kunjungan</small><h2>Rencana Anda</h2><div id="estimate"></div><p id="confirmation" role="status"></p></aside></form></main><footer>Kevin Simatupang / Demo Studio · Simulasi lokal · data fiktif.</footer></body></html>
