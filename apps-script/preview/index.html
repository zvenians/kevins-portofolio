.visual-booking {
  background: #d2c5af;
  color: #22231f;
}

.booking-visual {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 1px;
  max-width: 380px;
  margin: 35px auto 0;
  background: #7f7a70;
  border: 1px solid #7f7a70;
}

.booking-visual span,
.booking-visual strong,
.booking-visual b {
  padding: 16px;
  background: #eee9df;
}

.booking-visual span {
  font: 10px var(--mono);
}

.booking-visual strong {
  font-size: 18px;
}

.booking-visual b {
  grid-column: span 2;
  background: #28372f;
  color: #f2eee5;
  font: 12px var(--mono);
}

.research-table {
  overflow: auto;
  margin: 20px 0;
  border: 1px solid var(--line);
}

.research-table th {
  background: #deddd6;
}

.research-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 25px;
}

.research-intake {
  display: grid;
  grid-template-columns: .9fr 1.1fr;
  gap: 50px;
  margin-top: 55px;
  padding: 40px;
  background: #171a1c;
  color: #eae9e4;
  scroll-margin-top: 100px;
}

.research-intake h3 {
  margin-bottom: 18px;
  font: italic clamp(32px, 4vw, 54px)/1 var(--serif);
}

.research-intake p {
  font-size: 13px;
}

.research-intake form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.research-intake label,
.method-helper label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font: 10px var(--mono);
}

.research-intake input,
.research-intake select,
.research-intake textarea {
  width: 100%;
}

.research-intake .wide {
  grid-column: span 2;
}

.method-helper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 28px;
}

.method-helper p {
  grid-column: span 2;
  padding-left: 14px;
  border-left: 1px solid var(--accent);
}

.intake-result {
  padding: 18px;
  border: 1px solid #474d4f;
}

.intake-result p {
  margin-bottom: 15px;
}

.services-studio {
  background: #111416;
}

.service-lanes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}

.service-lanes article {
  display: flex;
  flex-direction: column;
  min-height: 440px;
  padding: 32px;
  background: #111416;
}

.service-lanes h3 {
  margin: 15px 0;
  font: italic 36px/1 var(--serif);
}

.service-lanes p {
  font-size: 13px;
}

.service-lanes ul {
  margin: 28px 0;
  padding-left: 18px;
  color: #c9cdd0;
  font-size: 12px;
}

.service-lanes li {
  margin: 9px 0;
}

.service-lanes small {
  margin-top: auto;
  padding: 20px 0;
  color: var(--muted);
  font-size: 10px;
}

.work-steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 55px;
  border-top: 1px solid var(--line);
}

.work-steps > .eyebrow {
  grid-column: 1 / -1;
  margin: 20px 0;
}

.work-steps div {
  padding: 22px 20px 22px 0;
  border-right: 1px solid var(--line);
}

.work-steps div + div {
  padding-left: 20px;
}

.work-steps div:last-child {
  border-right: 0;
}

.work-steps b,
.work-steps strong {
  display: block;
}

.work-steps b {
  margin-bottom: 25px;
  color: var(--accent);
  font: 10px var(--mono);
}

.work-steps strong {
  margin-bottom: 10px;
  font-size: 20px;
}

.work-steps p {
  font-size: 11px;
}

.booking-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.booking-form label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font: 10px var(--mono);
}

.booking-form fieldset {
  grid-column: span 2;
  margin: 0;
  padding: 15px;
  border: 1px solid var(--line);
}

.booking-form legend {
  padding: 0 7px;
  font: 10px var(--mono);
}

.slot-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.slot-grid label {
  display: block;
}

.slot-grid input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.slot-grid span {
  display: block;
  padding: 9px 12px;
  border: 1px solid var(--line);
}

.slot-grid input:checked + span {
  background: var(--accent);
  color: #111;
  border-color: var(--accent);
}

.booking-summary {
  margin-top: 18px;
  padding: 20px;
  border-left: 2px solid var(--accent);
}

.booking-summary h3 {
  margin-bottom: 18px;
}

.booking-summary dl {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.booking-summary dt {
  color: var(--muted);
  font: 9px var(--mono);
}

.booking-summary dd {
  margin: 4px 0 0;
}

.booking-summary p {
  margin-top: 18px;
}

.data-proof {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 30px;
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
}

.data-proof div {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.data-proof small {
  padding: 12px;
  background: #dfded7;
  font: 9px var(--mono);
}

@media (max-width: 900px) {
  .research-intake {
    grid-template-columns: 1fr;
  }

  .service-lanes {
    grid-template-columns: 1fr;
  }

  .service-lanes article {
    min-height: auto;
  }

  .work-steps {
    grid-template-columns: 1fr 1fr;
  }

  .data-proof {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  .research-intake {
    gap: 30px;
    padding: 24px 18px;
  }

  .research-intake form,
  .method-helper,
  .booking-form {
    grid-template-columns: 1fr;
  }

  .research-intake .wide,
  .method-helper p,
  .booking-form fieldset {
    grid-column: auto;
  }

  .work-steps,
  .data-proof div,
  .booking-summary dl {
    grid-template-columns: 1fr;
  }

  .work-steps div,
  .work-steps div + div {
    padding: 18px 0;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
}

.visual-commerce {
  background: #d9d5ca;
  color: #171a1c;
}

.commerce-visual {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  max-width: 430px;
  min-height: 230px;
  margin: 25px auto 0;
  border: 1px solid #8d8d86;
  background: #f0eee8;
}

.commerce-visual-copy {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 22px;
}

.commerce-visual-copy span,
.commerce-visual-copy small {
  font: 9px var(--mono);
  letter-spacing: .06em;
}

.commerce-visual-copy b {
  font: italic 34px/1 var(--serif);
}

.commerce-visual-receipt {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 22px;
  background: #26352d;
  color: #f0eee8;
  font: 9px var(--mono);
}

.commerce-visual-receipt strong {
  font: 24px 'DM Sans', sans-serif;
  letter-spacing: -.05em;
}

.commerce-demo {
  overflow: hidden;
  border: 1px solid var(--line);
  background: #ebe9e2;
  color: #171a1c;
  --commerce-line: #b9b8b1;
  --commerce-paper: #f6f4ee;
  --commerce-ink: #171a1c;
  --commerce-muted: #626866;
  --commerce-accent: #b6492f;
}

.demo-case-copy {
  grid-template-columns: 1fr;
}

.demo-case-copy > h2 {
  margin-bottom: 20px;
}

.commerce-demo input,
.commerce-demo select,
.commerce-demo textarea,
.commerce-demo button {
  color: var(--commerce-ink);
  border-color: var(--commerce-line);
}

.commerce-demo select option {
  background: var(--commerce-paper);
  color: var(--commerce-ink);
}

.commerce-notice,
.commerce-store-head,
.commerce-toolbar,
.commerce-cart-head,
.commerce-order-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.commerce-notice {
  padding: 12px 20px;
  border-bottom: 1px solid var(--commerce-line);
  background: #202522;
  color: #eeece5;
  font: 9px var(--mono);
  letter-spacing: .05em;
}

.commerce-store-head {
  padding: 34px;
  border-bottom: 1px solid var(--commerce-line);
}

.commerce-store-head h3,
.commerce-checkout h3,
.commerce-blueprint h3 {
  margin: 0;
  font: 500 clamp(34px, 5vw, 62px)/.98 'DM Sans', sans-serif;
  letter-spacing: -.055em;
}

.commerce-store-head h3 i,
.commerce-checkout h3 i,
.commerce-blueprint h3 i {
  font-family: var(--serif);
  font-weight: 400;
}

.commerce-store-head button {
  min-width: 110px;
  background: #202522;
  color: #eeece5;
  border: 0;
}

.commerce-store-head button b {
  display: inline-grid;
  width: 24px;
  height: 24px;
  margin-left: 9px;
  place-items: center;
  border-radius: 50%;
  background: var(--commerce-accent);
  color: #fff;
}

.commerce-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.8fr) minmax(300px, .8fr);
}

.commerce-catalog {
  min-width: 0;
  padding: 28px;
  border-right: 1px solid var(--commerce-line);
}

.commerce-toolbar {
  align-items: end;
  margin-bottom: 20px;
}

.commerce-toolbar label,
.commerce-shipping,
.commerce-voucher label,
.commerce-checkout label,
.commerce-product-copy label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font: 9px var(--mono);
  letter-spacing: .03em;
}

.commerce-toolbar label:first-child {
  flex: 1;
}

.commerce-toolbar input,
.commerce-toolbar select {
  width: 100%;
  background: var(--commerce-paper);
}

.commerce-categories {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.commerce-categories button {
  padding: 8px 11px;
  font-size: 10px;
}

.commerce-categories button[aria-pressed=true] {
  background: #202522;
  color: #eeece5;
  border-color: #202522;
}

.commerce-result-count {
  margin: 20px 0 12px;
  color: var(--commerce-muted);
  font: 9px var(--mono);
}

.commerce-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.commerce-product {
  min-width: 0;
  border: 1px solid var(--commerce-line);
  background: var(--commerce-paper);
}

.commerce-product-art {
  display: flex;
  position: relative;
  min-height: 230px;
  flex-direction: column;
  justify-content: space-between;
  padding: 19px;
  overflow: hidden;
  isolation: isolate;
}

.commerce-product-art::after {
  content: '';
  position: absolute;
  right: -22px;
  bottom: -40px;
  width: 150px;
  height: 190px;
  border: 1px solid currentColor;
  border-radius: 48% 48% 18% 18%;
  transform: rotate(-13deg);
  opacity: .45;
  z-index: -1;
}

.commerce-product-art span,
.commerce-product-art i {
  font: 9px var(--mono);
}

.commerce-product-art b {
  max-width: 75%;
  font: italic clamp(38px, 5vw, 68px)/.85 var(--serif);
}

.tone-sand { background: #d7c9b3; color: #342f29; }
.tone-clay { background: #b9664d; color: #f4eee5; }
.tone-steel { background: #aab4b7; color: #1e292c; }
.tone-forest { background: #31463a; color: #e9e5da; }
.tone-ink { background: #262b2e; color: #eeeae1; }
.tone-oat { background: #d8d0bc; color: #35332d; }

.commerce-product-copy {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px 14px;
  padding: 18px;
}

.commerce-product-copy small,
.commerce-product-copy label,
.commerce-product-copy button {
  grid-column: 1 / -1;
}

.commerce-product-copy small {
  color: var(--commerce-muted);
  font: 8px var(--mono);
}

.commerce-product-copy h4 {
  font-size: 18px;
  line-height: 1.15;
}

.commerce-product-copy strong {
  align-self: start;
  font-size: 12px;
  white-space: nowrap;
}

.commerce-product-copy select {
  width: 100%;
}

.commerce-product-copy button {
  background: #202522;
  color: #eeece5;
  border-color: #202522;
}

.commerce-cart {
  position: sticky;
  top: 0;
  align-self: start;
  max-height: 100vh;
  padding: 26px;
  overflow: auto;
  background: #dfddd5;
}

.commerce-cart-head {
  padding-bottom: 15px;
  border-bottom: 1px solid var(--commerce-line);
}

.commerce-cart-head button {
  border: 0;
  padding: 5px;
  font-size: 10px;
}

.commerce-cart-empty {
  padding: 40px 0;
}

.commerce-cart-empty span,
.commerce-shipping small,
.commerce-voucher-note {
  color: var(--commerce-muted);
  font-size: 10px;
}

.commerce-cart-lines article {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  padding: 17px 0;
  border-bottom: 1px solid var(--commerce-line);
}

.commerce-cart-lines b,
.commerce-cart-lines small,
.commerce-cart-lines span {
  display: block;
}

.commerce-cart-lines b {
  font-size: 12px;
}

.commerce-cart-lines small {
  color: var(--commerce-muted);
  font: 9px var(--mono);
}

.commerce-cart-lines span {
  margin-top: 5px;
  font-size: 11px;
}

.commerce-quantity {
  display: grid;
  grid-template-columns: 30px 28px 30px;
  align-items: center;
  text-align: center;
}

.commerce-quantity button {
  width: 30px;
  height: 30px;
  padding: 0;
}

.commerce-voucher {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 7px;
  margin-top: 22px;
}

.commerce-voucher input {
  width: 100%;
  text-transform: uppercase;
}

.commerce-voucher-note {
  min-height: 32px;
  margin: 7px 0 16px;
}

.commerce-shipping select {
  width: 100%;
}

.commerce-totals {
  margin: 24px 0;
  padding-top: 16px;
  border-top: 1px solid var(--commerce-line);
}

.commerce-totals div {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin: 8px 0;
  font-size: 11px;
}

.commerce-totals dd {
  margin: 0;
}

.commerce-totals .commerce-grand-total {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid var(--commerce-line);
  font-size: 18px;
}

.commerce-checkout-jump {
  width: 100%;
}

.commerce-empty {
  grid-column: 1 / -1;
  min-height: 200px;
  padding: 50px 20px;
  border: 1px dashed var(--commerce-line);
  text-align: center;
}

.commerce-checkout {
  display: grid;
  grid-template-columns: .85fr 1.15fr;
  gap: 50px;
  padding: 48px 34px;
  border-top: 1px solid var(--commerce-line);
  background: #202522;
  color: #eeece5;
}

.commerce-checkout p {
  margin-top: 20px;
  font-size: 12px;
}

.commerce-checkout form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.commerce-checkout input,
.commerce-checkout select,
.commerce-checkout textarea {
  width: 100%;
  color: #eeece5;
  border-color: #525955;
}

.commerce-checkout select option {
  background: #202522;
  color: #eeece5;
}

.commerce-checkout .wide {
  grid-column: 1 / -1;
}

.commerce-checkout .consent {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: start;
}

.commerce-checkout .consent input {
  width: auto;
  margin-top: 2px;
}

.commerce-order {
  grid-column: 1 / -1;
  margin-top: 10px;
  padding: 25px;
  border: 1px solid #525955;
}

.commerce-order-head h3 {
  font-size: 32px;
}

.commerce-order-head strong {
  color: #ff8968;
  font-size: 22px;
}

.commerce-order-lines {
  display: grid;
  gap: 7px;
  margin: 20px 0;
  padding: 15px 0;
  border-top: 1px solid #525955;
  border-bottom: 1px solid #525955;
}

.commerce-order-lines span {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font-size: 11px;
}

.commerce-blueprint {
  padding: 48px 34px;
  border-top: 1px solid var(--commerce-line);
}

.commerce-blueprint-head {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 30px;
}

.commerce-blueprint-head .eyebrow {
  grid-column: 1 / -1;
}

.commerce-blueprint-head p {
  max-width: 480px;
  align-self: end;
}

.commerce-sheet-map {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  margin: 35px 0;
  border: 1px solid var(--commerce-line);
  background: var(--commerce-line);
}

.commerce-sheet-map article {
  display: grid;
  min-height: 150px;
  padding: 20px;
  background: var(--commerce-paper);
}

.commerce-sheet-map b {
  color: var(--commerce-accent);
  font: 9px var(--mono);
}

.commerce-sheet-map span {
  align-self: end;
  font-size: 20px;
}

.commerce-sheet-map small {
  color: var(--commerce-muted);
  font-size: 10px;
}

.commerce-flow {
  display: grid;
  grid-template-columns: repeat(7, auto);
  align-items: center;
  gap: 10px;
  padding: 20px;
  border: 1px solid var(--commerce-line);
  font: 10px var(--mono);
}

.commerce-flow span {
  padding: 12px;
  background: var(--commerce-paper);
}

.commerce-flow b {
  color: var(--commerce-accent);
}

.commerce-blueprint > .disclosure {
  max-width: 850px;
  margin-top: 20px;
}

@media (max-width: 980px) {
  .commerce-layout,
  .commerce-checkout {
    grid-template-columns: 1fr;
  }

  .commerce-catalog {
    border-right: 0;
  }

  .commerce-cart {
    position: static;
    max-height: none;
    border-top: 1px solid var(--commerce-line);
  }

  .commerce-blueprint-head {
    grid-template-columns: 1fr;
  }

  .commerce-sheet-map {
    grid-template-columns: repeat(2, 1fr);
  }

  .commerce-flow {
    grid-template-columns: 1fr;
  }

  .commerce-flow b {
    transform: rotate(90deg);
    text-align: center;
  }
}

@media (max-width: 600px) {
  .commerce-notice {
    align-items: flex-start;
    flex-direction: column;
    gap: 6px;
  }

  .commerce-store-head,
  .commerce-toolbar,
  .commerce-order-head {
    align-items: stretch;
    flex-direction: column;
  }

  .commerce-store-head,
  .commerce-catalog,
  .commerce-cart,
  .commerce-checkout,
  .commerce-blueprint {
    padding: 24px 18px;
  }

  .commerce-grid,
  .commerce-checkout form,
  .commerce-sheet-map {
    grid-template-columns: 1fr;
  }

  .commerce-checkout .wide {
    grid-column: auto;
  }

  .commerce-product-art {
    min-height: 210px;
  }

  .commerce-voucher {
    grid-template-columns: 1fr;
  }

  .commerce-order-lines span {
    flex-direction: column;
    gap: 2px;
  }
}

/* A quieter, document-led layer for the working demonstrations. */

.working-demo-head{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;padding:28px;border-bottom:1px solid #aaa9a2;background:#d6d2c8}

.working-demo-head h3{font:500 clamp(28px,4vw,48px)/.98 var(--sans);letter-spacing:-.05em;margin-top:12px;max-width:620px}

.prep-layout{display:grid;grid-template-columns:240px 1fr;min-height:610px}.prep-layout>aside{padding:25px;border-right:1px solid #aaa9a2;background:#d6d2c8}.prep-layout aside>label{display:flex;flex-direction:column;gap:7px;margin-bottom:17px}.prep-layout .check-row{flex-direction:row;align-items:center}.prep-layout .check-row input{width:auto}.prep-layout>main{padding:25px;min-width:0}.desk-tabs{display:flex;border-bottom:1px solid #999c97;margin-bottom:20px}.desk-tabs button{border:0;border-bottom:3px solid transparent;font:10px var(--mono)}.desk-tabs button[aria-pressed=true]{border-bottom-color:#9e4a32}.prep-layout th{background:#cfcdc5}.prep-findings{margin-top:25px;border-top:1px solid #a19e95;padding-top:16px}.prep-findings strong{display:block;margin:8px 0;font-size:20px}.prep-findings p{font-size:10px;padding:7px 0;border-top:1px solid #bbb8ae}

.field-category-progress {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  margin: 20px 0;
  border: 1px solid var(--line);
  background: var(--line);
}

.field-category-progress > div {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  padding: 14px;
  background: var(--paper);
  font-size: 11px;
}

.field-category-progress i {
  grid-column: 1 / -1;
  height: 4px;
  overflow: hidden;
  background: #d1cec4;
}

.field-category-progress em {
  display: block;
  height: 100%;
  background: #8b3d2a;
}

@media (max-width: 700px) {
  .field-category-progress { grid-template-columns: 1fr 1fr; }

/* Spatial layer: quiet at rest, expressive while exploring. */
:root{--pointer-x:50vw;--pointer-y:35vh;--hero-x:0;--hero-y:0;--scroll-progress:0%}
body{overflow-x:hidden;background-image:linear-gradient(rgba(234,233,228,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(234,233,228,.018) 1px,transparent 1px);background-size:64px 64px}
body:before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;background:radial-gradient(440px circle at var(--pointer-x) var(--pointer-y),rgba(255,102,59,.055),transparent 72%)}
.header{position:sticky;top:0;background:rgba(11,13,14,.78);backdrop-filter:blur(18px) saturate(120%);transition:padding .45s var(--ease),background .45s var(--ease);z-index:40}
.header.is-scrolled{padding-top:13px;padding-bottom:13px;background:rgba(11,13,14,.92)}
.header nav a{position:relative;color:var(--muted);transition:color .3s var(--ease)}
.header nav a:after{content:"";position:absolute;left:0;right:100%;bottom:-9px;height:1px;background:var(--accent);transition:right .45s var(--ease)}
.header nav a.is-current{color:var(--ink)}.header nav a.is-current:after{right:0}
.living-progress{position:fixed;z-index:70;top:0;left:0;width:var(--scroll-progress);height:2px;background:var(--accent);pointer-events:none;transition:width .1s linear}
.living-halo{position:fixed;z-index:60;left:0;top:0;width:42px;height:42px;border:1px solid rgba(234,233,228,.28);border-radius:50%;pointer-events:none;transform:translate3d(calc(var(--pointer-x) - 21px),calc(var(--pointer-y) - 21px),0);transition:width .25s,height .25s,border-color .25s;mix-blend-mode:difference}
.space-index{position:fixed;z-index:35;right:18px;top:50%;translate:0 -50%;display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--muted)}
.space-index:before,.space-index:after{content:"";width:1px;height:44px;background:var(--line)}
.space-index b{font:9px var(--mono);font-weight:400;writing-mode:vertical-rl;letter-spacing:.15em}.space-index i{width:5px;height:5px;border:1px solid currentColor;border-radius:50%;transition:.3s}.space-index i.is-current{background:var(--accent);border-color:var(--accent);scale:1.5}
.arrival{min-height:calc(100svh - 89px);position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.arrival:before{content:"";position:absolute;z-index:-1;width:min(52vw,760px);aspect-ratio:1;border:1px solid rgba(234,233,228,.12);border-radius:50%;right:-7vw;top:11%;translate:calc(var(--hero-x)*-7px) calc(var(--hero-y)*-5px);box-shadow:inset 0 0 0 7vw rgba(11,13,14,.18),inset 0 0 0 calc(7vw + 1px) rgba(234,233,228,.04);transition:translate .18s linear}
.arrival:after{content:"X 116.87 / Y -1.24";position:absolute;right:4.3%;top:24%;font:8px var(--mono);letter-spacing:.14em;color:var(--muted);rotate:90deg;transform-origin:right top}
.name-display{position:relative;z-index:1;perspective:900px}.name-display span{position:relative;width:max-content;max-width:100%;transform:translate3d(calc(var(--hero-x)*9px),calc(var(--hero-y)*6px),0);transition:transform .2s linear;text-shadow:calc(var(--hero-x)*-9px) calc(var(--hero-y)*-7px) 0 rgba(234,233,228,.08);animation:headline-in 1s var(--ease) both}.name-display span:nth-child(2){transform:translate3d(calc(var(--hero-x)*-12px),calc(var(--hero-y)*-5px),0);animation-delay:.08s}
.arrival-bottom{animation:arrival-up .85s .3s var(--ease) both}.signal{animation:signal-live 1.8s ease-in-out infinite}@keyframes headline-in{from{opacity:0;clip-path:inset(0 0 100% 0);translate:0 12vh}to{opacity:1;clip-path:inset(0);translate:0}}@keyframes arrival-up{from{opacity:0;translate:0 26px}to{opacity:1;translate:0}}@keyframes signal-live{50%{opacity:.25;scale:.7}}
.instrument{position:relative;background:linear-gradient(120deg,rgba(255,255,255,.018),transparent 55%)}.instrument:before{content:"";position:absolute;right:0;top:0;width:37%;aspect-ratio:1;border:1px solid rgba(255,102,59,.35);border-radius:50%;translate:38% -45%;transition:scale .7s var(--ease),translate .7s var(--ease)}.instrument:hover:before{scale:1.25;translate:25% -33%}
.plane{transform:skewY(-8deg) translateX(calc(var(--n)*10px)) translateZ(calc(var(--n)*12px));box-shadow:0 calc(var(--n)*5px) calc(var(--n)*12px) rgba(0,0,0,.18)}
section{position:relative}.section-label{transition:color .45s var(--ease)}.section-label:before{content:"";position:absolute;left:4.3%;margin-top:-19px;width:0;height:1px;background:var(--accent);transition:width 1.1s var(--ease)}section.is-visible>.section-label:before{width:91.4%}
.motion-reveal{opacity:.22;transform:translateY(42px);clip-path:inset(0 0 22% 0);transition:opacity .9s var(--ease),transform 1s var(--ease),clip-path 1s var(--ease)}.motion-reveal.is-visible{opacity:1;transform:none;clip-path:inset(0)}
.exhibit{perspective:1000px;position:relative}.exhibit:before{content:attr(data-index);position:absolute;left:-22px;top:0;font:8px var(--mono);color:var(--muted);opacity:0;translate:0 10px;transition:.4s var(--ease)}.exhibit:hover:before{opacity:1;translate:0 0}
.exhibit .visual{transform:rotateX(calc(var(--tilt-y,0)*-1deg)) rotateY(calc(var(--tilt-x,0)*1deg)) translateY(var(--lift,0));transform-style:preserve-3d;box-shadow:0 28px 70px rgba(0,0,0,0);transition:transform .22s linear,box-shadow .55s var(--ease)}.exhibit:hover .visual{--lift:-9px;box-shadow:0 28px 70px rgba(0,0,0,.28)}
.exhibit .visual:after{content:"VIEW / EXPLORE";position:absolute;z-index:5;right:18px;bottom:16px;font:8px var(--mono);letter-spacing:.12em;padding:7px 9px;background:var(--bg);color:var(--ink);translate:0 16px;opacity:0;transition:.45s var(--ease)}.exhibit:hover .visual:after{translate:0;opacity:1}
.exhibit h3 span{display:inline-block;transition:transform .4s var(--ease)}.exhibit:hover h3 span{transform:translate(4px,-4px)}
.data-lab{overflow:hidden}.data-lab:before{content:"";position:absolute;width:55vw;height:1px;background:#ad3e20;right:-10vw;top:9vw;rotate:-17deg;opacity:.35}
.open-lab:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),rgba(234,233,228,.035) 25%);mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent)}
.connect{min-height:80svh;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.connect:after{content:"LET'S TALK";position:absolute;right:-.05em;bottom:-.2em;font:700 clamp(90px,19vw,310px)/.7 var(--sans);letter-spacing:-.09em;color:transparent;-webkit-text-stroke:1px rgba(234,233,228,.07);pointer-events:none}
.case-page h1{view-transition-name:case-title}.case-visual{view-transition-name:case-visual}.case-visual .visual{transform-origin:center;animation:case-settle 1s var(--ease) both}@keyframes case-settle{from{clip-path:inset(9% 6%);transform:scale(.96)}to{clip-path:inset(0);transform:none}}
::view-transition-old(root){animation:route-out .3s var(--ease) both}::view-transition-new(root){animation:route-in .55s var(--ease) both}@keyframes route-out{to{opacity:0;transform:scale(.99)}}@keyframes route-in{from{opacity:0;transform:translateY(14px)}}
@media(pointer:coarse),(max-width:900px){.living-halo{display:none}.space-index{right:8px}.arrival:before{width:70vw;right:-27vw}.exhibit .visual{transform:none!important}.exhibit:before{display:none}}
@media(max-width:600px){body{background-size:38px 38px}.header{backdrop-filter:blur(14px)}.arrival{min-height:calc(100svh - 126px)}.arrival:after{display:none}.arrival:before{top:18%;width:85vw}.name-display span,.name-display span:nth-child(2){transform:none;text-shadow:4px 5px 0 rgba(234,233,228,.07)}.space-index{display:none}.exhibit .visual:after{opacity:1;translate:0;font-size:7px}.motion-reveal{transform:translateY(22px)}.connect{min-height:68svh}}
.reduced .living-halo,.reduced .space-index{display:none}.reduced .motion-reveal{opacity:1;transform:none;clip-path:none}.reduced .name-display span,.reduced .name-display span:nth-child(2){transform:none;text-shadow:none}.reduced .arrival:before{translate:0}.reduced .case-visual .visual{animation:none}
@media(prefers-reduced-motion:reduce){.living-halo,.space-index{display:none}.motion-reveal{opacity:1;transform:none;clip-path:none}.name-display span,.name-display span:nth-child(2){transform:none;text-shadow:none}.arrival:before{translate:0}.case-visual .visual{animation:none}}

/* Functional depth for interactive exhibits: input, process and evidence occupy distinct planes. */
.spatial-demo{--depth-rx:.55deg;--depth-ry:-.65deg;--depth-x:50%;--depth-y:50%;position:relative;isolation:isolate;perspective:1500px;transform-style:preserve-3d;animation:workbench-arrive .85s var(--ease) both}
.spatial-demo:before{content:"";position:absolute;z-index:0;inset:0;pointer-events:none;background:radial-gradient(500px circle at var(--depth-x) var(--depth-y),rgba(255,102,59,.09),transparent 58%),repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),rgba(23,26,28,.055) 12.5%),repeating-linear-gradient(0deg,transparent 0,transparent calc(12.5% - 1px),rgba(23,26,28,.045) 12.5%);opacity:.8;mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 92%,transparent)}
.spatial-demo:after{content:"Z / " var(--stage-index);position:absolute;z-index:8;right:12px;bottom:12px;pointer-events:none;font:8px var(--mono);letter-spacing:.14em;color:currentColor;opacity:.48;writing-mode:vertical-rl}
.spatial-coordinate{position:absolute;z-index:12;top:10px;right:12px;display:flex;gap:12px;pointer-events:none;font:7px var(--mono);letter-spacing:.12em;color:currentColor;opacity:.48}
.spatial-coordinate b{font-weight:400;font-variant-numeric:tabular-nums}
.working-demo>.spatial-coordinate{top:14px;color:#171a1c}.working-demo>.spatial-coordinate span{display:none}
.workbench-body,.commerce-demo,.toolkit-shell,.data-lab .workspace>*:not(.spatial-coordinate){position:relative;z-index:1;transform-style:preserve-3d}
.workbench-body{transform:rotateX(var(--depth-rx)) rotateY(var(--depth-ry));transform-origin:center 40%;transition:transform .16s linear}
.depth-plane{position:relative;transform-style:preserve-3d;will-change:transform;transition:transform .28s var(--ease),filter .35s var(--ease),box-shadow .35s var(--ease)}
.depth-plane--label{transform:translateZ(8px)}
.depth-plane--input{transform:translateZ(24px)}
.depth-plane--output{transform:translateZ(46px);filter:drop-shadow(0 16px 18px rgba(12,14,13,.09))}
.spatial-demo:hover .depth-plane--input,.spatial-demo.has-depth-focus .depth-plane--input{transform:translate3d(-2px,-2px,32px)}
.spatial-demo:hover .depth-plane--output,.spatial-demo.has-depth-focus .depth-plane--output{transform:translate3d(3px,-4px,60px);filter:drop-shadow(0 24px 26px rgba(12,14,13,.15))}
.depth-plane.is-depth-active{transform:translateZ(72px)!important;filter:drop-shadow(0 28px 30px rgba(12,14,13,.2))}
.depth-readout{position:absolute;z-index:15;left:16px;top:98px;display:grid;gap:6px;pointer-events:none;color:#171a1c;font:7px var(--mono);letter-spacing:.11em}
.depth-readout i{display:block;position:relative;width:1px;height:17px;margin-left:3px;background:currentColor;opacity:.28}.depth-readout i:after{content:"";position:absolute;left:-2px;top:0;width:5px;height:5px;background:#a7472f;animation:depth-signal 2.4s ease-in-out infinite}
.working-demo-head{position:relative;z-index:3;transform:translateZ(10px)}
.working-demo>footer{position:relative;z-index:4}
.field-device,.prep-layout,.document-desk,.scope-desk,.quality-console,.ops-console{position:relative;transform-style:preserve-3d}
.field-device>aside,.prep-layout>aside{box-shadow:10px 0 24px rgba(8,10,9,.1)}
.paper-preview{transform-origin:center top}
.document-desk:hover .paper-preview{transform:translate3d(4px,-4px,68px) rotateY(-.5deg)}
.scope-desk #scope-output{box-shadow:16px 18px 0 rgba(23,26,28,.12)}

.quality-frame{box-shadow:18px 22px 0 rgba(19,23,21,.15)}

/* Demo Worlds — each working exhibit has its own visual culture. */

:where(#next-wave-demo,#booking-demo,#archive-demo,#commerce-demo,.research-toolkit,.data-lab .workspace){font-synthesis:none;text-rendering:optimizeLegibility}

/* Future Space — architectural depth for the complete experience. */
:root{
  --sans:"Bricolage Grotesque","Instrument Sans",sans-serif;
  --serif:"Bodoni Moda","Newsreader",serif;
  --mono:"Space Mono","IBM Plex Mono",monospace;
  --display:"Syne","Bricolage Grotesque",sans-serif;
  --scene-x:0;--scene-y:0;
  --future-orange:#ff5d35;--future-silver:#cbd0d2;--future-black:#080a0b;
}
html{background:var(--future-black)}
body{font-family:var(--sans);font-optical-sizing:auto;background-color:#0a0c0d;background-image:linear-gradient(rgba(234,233,228,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(234,233,228,.018) 1px,transparent 1px);background-size:72px 72px}
h1,h2,h3,h4,.name-display,.connect h2,.case-page h1,.resume-page h1,.admin-page h1{font-family:var(--display);font-weight:600;font-synthesis:none}
h2 i,.section-heading h2 i,.connect h2 i,.name-display i{font-family:var(--serif);font-weight:400}
.mono,.eyebrow,.section-label,.hero-foot,.exhibit-meta,.tags,.case-page .back,.resume-page .back{font-family:var(--mono)}

/* Ambient coordinate volume. */
.future-atmosphere{position:fixed;z-index:0;inset:0;overflow:hidden;pointer-events:none;perspective:1200px;transform-style:preserve-3d;background:#080a0b}
main,footer{position:relative;z-index:1}
.future-atmosphere:before{content:"";position:absolute;left:-15%;right:-15%;bottom:-33vh;height:78vh;background:repeating-linear-gradient(90deg,rgba(201,205,208,.085) 0 1px,transparent 1px 7.5%),repeating-linear-gradient(0deg,rgba(201,205,208,.065) 0 1px,transparent 1px 52px);transform:rotateX(67deg) translate3d(calc(var(--scene-x)*-28px),calc(var(--scene-y)*18px),-80px);transform-origin:center bottom;mask-image:linear-gradient(to top,#000 25%,transparent 85%)}
.future-atmosphere:after{content:"Z / 116.87\A X / -01.24\A ENV / LIVE";white-space:pre;position:absolute;left:22px;bottom:24px;color:rgba(201,205,208,.34);font:8px/1.9 var(--mono);letter-spacing:.15em}
.future-atmosphere i{position:absolute;display:block;border:1px solid rgba(201,205,208,.13);transform-style:preserve-3d;will-change:transform}
.future-atmosphere i:nth-child(1){width:36vw;aspect-ratio:1;right:-14vw;top:8vh;border-radius:50%;box-shadow:inset 0 0 0 5vw rgba(255,93,53,.012),inset 0 0 0 calc(5vw + 1px) rgba(255,93,53,.12);transform:translate3d(calc(var(--scene-x)*-22px),calc(var(--scene-y)*-16px),0) rotateX(66deg) rotateZ(18deg);animation:future-orbit 18s linear infinite}
.future-atmosphere i:nth-child(2){width:24vw;height:42vh;left:9vw;top:24vh;border-color:rgba(255,93,53,.12);transform:translate3d(calc(var(--scene-x)*32px),calc(var(--scene-y)*18px),-120px) rotateY(68deg) rotateZ(-7deg);animation:future-drift 11s ease-in-out infinite alternate}
.future-atmosphere i:nth-child(3){width:46vw;height:1px;left:28vw;top:69vh;border:0;background:linear-gradient(90deg,transparent,rgba(255,93,53,.42),transparent);transform:translate3d(calc(var(--scene-x)*-18px),calc(var(--scene-y)*12px),0) rotate(-13deg)}
.future-atmosphere b{position:absolute;right:5vw;bottom:7vh;width:7px;height:7px;background:var(--future-orange);box-shadow:0 0 26px rgba(255,93,53,.7);animation:future-signal 2.4s ease-in-out infinite}

/* Navigation behaves like a floating instrument panel. */
.header{font-family:var(--sans);border-bottom-color:rgba(201,205,208,.16);box-shadow:0 18px 55px rgba(0,0,0,.18);transform:translateZ(80px)}
.header:before{content:"";position:absolute;left:4.3%;right:4.3%;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--future-orange),transparent 36%);transform-origin:left;scale:.22 1;transition:scale .7s var(--ease)}
.header.is-scrolled:before{scale:1 1}
.identity b{font-family:var(--display);font-weight:700;border-color:rgba(234,233,228,.65);box-shadow:5px 5px 0 rgba(255,93,53,.22);transform:translateZ(16px)}
.identity span,.location{font-family:var(--mono)}
.header nav a{font-family:var(--sans);font-weight:500}

/* Every major space is a composed 3D stage. */
main{transform-style:preserve-3d}
.world-stage{--world-rx:.25deg;--world-ry:-.35deg;--world-scroll:0;--world-light:50% 30%;position:relative;isolation:isolate;perspective:1800px;transform-style:preserve-3d;overflow:clip}
.world-stage:before{content:"";position:absolute;z-index:-1;inset:5% 0 3%;pointer-events:none;background:radial-gradient(720px circle at var(--world-light),rgba(255,93,53,.06),transparent 62%);opacity:.8}
.world-stage:after{content:attr(data-world);position:absolute;z-index:-1;right:-.02em;top:.08em;color:transparent;-webkit-text-stroke:1px rgba(201,205,208,.035);font:700 clamp(180px,30vw,480px)/.7 var(--display);letter-spacing:-.09em;transform:translate3d(0,calc(var(--world-scroll)*-35px),-150px);pointer-events:none}
.world-stage>.section-label,.world-stage>.section-heading,.world-stage>.collection-switch,.world-stage>.toolbar,.world-stage>.search-row,.world-stage>#exhibition,.world-stage>.lab-tabs,.world-stage>.workspace,.world-stage>.playground,.world-stage>.architecture-nodes,.world-stage>.architecture-note,.world-stage>.research-layout,.world-stage>.research-toolkit,.world-stage>.research-services,.world-stage>.research-intake,.world-stage>.research-boundary,.world-stage>.experiments-list,.world-stage>.profile-grid,.world-stage>.capability,.world-stage>h2,.world-stage>.connect-actions,.world-stage>.connect-note{position:relative;transform-style:preserve-3d}
.world-stage>.section-label{transform:translate3d(0,calc(var(--world-scroll)*-10px),34px)}
.world-stage>.section-heading{transform:rotateX(var(--world-rx)) rotateY(var(--world-ry)) translate3d(0,calc(var(--world-scroll)*-20px),56px);transform-origin:center;transition:transform .2s linear}
.world-stage>.section-heading h2{text-shadow:0 18px 38px rgba(0,0,0,.16)}
.world-stage>.section-heading p{transform:translateZ(35px)}
.world-axis{position:absolute;z-index:5;right:4.3%;top:150px;display:grid;justify-items:center;gap:8px;color:rgba(160,165,168,.65);font:8px var(--mono);letter-spacing:.12em;pointer-events:none;transform:translateZ(80px)}
.world-axis i{width:1px;height:82px;background:linear-gradient(to bottom,var(--future-orange),rgba(201,205,208,.12));position:relative}
.world-axis i:after{content:"";position:absolute;left:-2px;top:calc((var(--world-scroll) + 1)*38px);width:5px;height:5px;background:var(--future-orange);box-shadow:0 0 13px rgba(255,93,53,.65)}
.world-axis b{font-weight:400;writing-mode:vertical-rl}

/* Arrival: a typographic object suspended in space. */
.arrival{perspective:1600px;transform-style:preserve-3d}
.arrival>.section-label{z-index:7}
.arrival .name-display{transform-style:preserve-3d;transform:rotateX(calc(var(--hero-y)*-2deg)) rotateY(calc(var(--hero-x)*3deg));transition:transform .18s linear;transform-origin:left center}
.arrival .name-display span{font-family:var(--display);font-weight:700;text-shadow:0 1px 0 #c4c5c0,0 2px 0 #a7aaa7,0 3px 0 #7f8482,0 4px 0 #555b59,0 18px 48px rgba(0,0,0,.5);transform-style:preserve-3d}
.arrival .name-display span:first-child{transform:translate3d(calc(var(--hero-x)*15px),calc(var(--hero-y)*9px),75px)}
.arrival .name-display span:nth-child(2){transform:translate3d(calc(var(--hero-x)*-18px),calc(var(--hero-y)*-8px),28px)}
.arrival-bottom{position:relative;z-index:6;transform-style:preserve-3d}
.arrival-intro{transform:translateZ(40px)}
.instrument{transform:rotateX(calc(var(--hero-y)*-2deg)) rotateY(calc(var(--hero-x)*3deg)) translateZ(54px);transform-style:preserve-3d;box-shadow:0 35px 70px rgba(0,0,0,.26);transition:transform .18s linear}
.instrument-tabs{transform:translateZ(24px);background:rgba(11,13,14,.72);backdrop-filter:blur(8px)}
.instrument-surface{transform-style:preserve-3d}
.instrument-surface .plane{font-family:var(--mono);transform:skewY(-8deg) translate3d(calc(var(--n)*10px),calc(var(--n)*-2px),calc(var(--n)*28px));box-shadow:0 calc(var(--n)*9px) calc(var(--n)*18px) rgba(0,0,0,.32)}
.instrument-surface:hover .plane{transform:skewY(-2deg) translate3d(0,0,calc(var(--n)*13px))}
.arrival-orbit{position:absolute;z-index:2;right:3vw;top:14%;width:min(44vw,680px);aspect-ratio:1;transform-style:preserve-3d;pointer-events:none;transform:rotateX(calc(61deg + var(--hero-y)*5deg)) rotateZ(calc(-18deg + var(--hero-x)*4deg)) translateZ(-30px);transition:transform .2s linear}
.arrival-orbit i{position:absolute;inset:10%;border:1px solid rgba(201,205,208,.14);border-radius:50%;animation:arrival-ring 18s linear infinite}
.arrival-orbit i:nth-child(2){inset:23%;border-color:rgba(255,93,53,.35);animation-direction:reverse;animation-duration:13s}
.arrival-orbit i:nth-child(3){inset:36%;border-style:dashed;animation-duration:8s}
.arrival-orbit i:before{content:"";position:absolute;width:8px;height:8px;left:50%;top:-4px;background:var(--future-orange);box-shadow:0 0 16px rgba(255,93,53,.7)}
.arrival-orbit b{position:absolute;inset:43%;display:grid;place-items:center;border:1px solid rgba(234,233,228,.25);font:700 clamp(30px,5vw,72px)/1 var(--display);letter-spacing:-.08em;transform:rotateZ(18deg) rotateX(-61deg)}
.arrival-orbit span{position:absolute;right:13%;bottom:15%;font:8px var(--mono);letter-spacing:.16em;transform:rotateZ(18deg) rotateX(-61deg)}

/* Work index: exhibits become physical slabs. */
.collection-switch,.toolbar,.search-row{transform:translateZ(38px)}
.collection-switch button,.filters button,.view-switch button{font-family:var(--mono)}
.exhibition{perspective:1700px;transform-style:preserve-3d}
.exhibit{transform-style:preserve-3d;transition:transform .55s var(--ease),filter .55s var(--ease);transform:translate3d(0,calc(var(--world-scroll)*-10px),0)}
.exhibit:nth-child(even){transform:translate3d(0,calc(90px + var(--world-scroll)*-16px),-32px)}
.exhibit:hover{z-index:3;filter:drop-shadow(0 36px 28px rgba(0,0,0,.32))}
.exhibit .visual{border:1px solid rgba(234,233,228,.22);transform:rotateX(calc(var(--tilt-y,0)*-1deg)) rotateY(calc(var(--tilt-x,0)*1deg)) translate3d(0,var(--lift,0),34px);box-shadow:10px 12px 0 rgba(0,0,0,.5),24px 30px 70px rgba(0,0,0,.16);backface-visibility:hidden}
.exhibit .visual:before{content:"";position:absolute;z-index:4;inset:0;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,255,.16),transparent 24%,transparent 72%,rgba(0,0,0,.12));mix-blend-mode:soft-light}
.exhibit h3{font-family:var(--display);transform:translateZ(28px)}
.exhibit p,.exhibit-meta,.illustration{transform:translateZ(14px)}
.exhibition.index .exhibit,.exhibition.index .exhibit:nth-child(even){transform:none}

/* Light spaces retain depth without looking like dark-mode cards. */
.data-lab.world-stage:before{background:radial-gradient(740px circle at var(--world-light),rgba(50,71,151,.1),transparent 64%)}
.data-lab .lab-tabs{position:relative;z-index:4;transform:rotateX(var(--world-rx)) translateZ(36px);box-shadow:0 22px 55px rgba(30,31,28,.12)}
.data-lab .workspace{transform:rotateX(var(--world-rx)) rotateY(var(--world-ry)) translateZ(52px)!important;box-shadow:22px 26px 0 rgba(20,28,36,.23),0 50px 100px rgba(20,28,36,.18)!important;transition:transform .18s linear}
.data-lab .workspace-heading{transform:translateZ(26px)}

/* Open lab, research, experiments, profile and contact become planes in one system. */
.playground{perspective:1400px;transform:rotateX(var(--world-rx)) rotateY(var(--world-ry)) translateZ(48px);transition:transform .2s linear}
.control-list{transform:translateZ(42px);background:#101416;padding:28px;border:1px solid rgba(201,205,208,.18);box-shadow:12px 14px 0 rgba(255,93,53,.22)}
.play-preview{transform:translateZ(68px);box-shadow:20px 25px 65px rgba(0,0,0,.28)}
.architecture-nodes{transform:translateZ(38px)}
.architecture-note{transform:translateZ(52px);background:rgba(21,25,27,.82);backdrop-filter:blur(12px)}
.research-studio{perspective:1800px}
.research-layout{transform:rotateX(var(--world-rx)) rotateY(var(--world-ry)) translateZ(44px);box-shadow:20px 26px 70px rgba(0,0,0,.22);transition:transform .2s linear}
.research-toolkit{transform:rotateX(var(--world-rx)) rotateY(var(--world-ry)) translateZ(38px);box-shadow:20px 26px 70px rgba(0,0,0,.2);transition:transform .2s linear}
.experiments-list{transform:rotateX(var(--world-rx)) rotateY(var(--world-ry)) translateZ(42px);box-shadow:20px 26px 80px rgba(0,0,0,.25);transition:transform .2s linear}
.experiment{position:relative;overflow:hidden;transform-style:preserve-3d}
.experiment:after{content:"";position:absolute;right:-36px;bottom:-36px;width:100px;height:100px;border:1px solid rgba(255,93,53,.25);transform:rotate(45deg) translateZ(20px)}
.experiment>*{position:relative;z-index:1;transform:translateZ(22px)}
.profile-grid{transform:rotateX(var(--world-rx)) rotateY(var(--world-ry)) translateZ(50px);transition:transform .2s linear}
.profile-mark{text-shadow:1px 1px 0 #c94b2c,2px 2px 0 #9e3823,3px 3px 0 #702819,18px 28px 55px rgba(0,0,0,.3);transform:translateZ(65px)}
.profile-copy{transform:translateZ(28px)}
.capability{transform:translateZ(55px);background:rgba(11,13,14,.68);backdrop-filter:blur(12px);padding:24px;border:1px solid rgba(201,205,208,.13)}
.connect>h2{transform:rotateX(var(--world-rx)) rotateY(var(--world-ry)) translateZ(70px);text-shadow:0 28px 60px rgba(0,0,0,.45);transition:transform .2s linear}
.connect-actions{transform:translateZ(54px)}
.connect-actions a{background:rgba(11,13,14,.74);backdrop-filter:blur(12px);border:1px solid rgba(201,205,208,.18);padding:20px;box-shadow:7px 8px 0 rgba(255,93,53,.15);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.connect-actions a:hover{transform:translate3d(-3px,-6px,20px);box-shadow:12px 14px 0 rgba(255,93,53,.32)}

/* Case studies and resume use the same spatial material. */
.case-page,.resume-page{perspective:1800px;transform-style:preserve-3d}
.case-page>h1,.resume-page>h1{transform:rotateX(calc(var(--scene-y)*-1.7deg)) rotateY(calc(var(--scene-x)*2.2deg)) translateZ(55px);text-shadow:0 22px 55px rgba(0,0,0,.38);transition:transform .18s linear}
.case-summary,.resume-lead{transform:translateZ(28px)}
.case-visual{perspective:1500px;transform-style:preserve-3d}
.case-visual .visual{transform:rotateX(calc(var(--scene-y)*-1.2deg)) rotateY(calc(var(--scene-x)*1.5deg)) translateZ(42px);box-shadow:18px 22px 0 rgba(255,93,53,.12),0 48px 100px rgba(0,0,0,.34);transition:transform .18s linear}
.case-copy{position:relative;transform-style:preserve-3d}
.case-copy h2{font-family:var(--display);transform:translateZ(28px)}
.case-copy>p,.case-copy>div{transform:translateZ(12px)}
.resume-overview{perspective:1400px;transform-style:preserve-3d}
.resume-overview section{transform:translateZ(24px);box-shadow:8px 10px 0 rgba(255,93,53,.1);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.resume-overview section:hover{transform:translate3d(-2px,-7px,50px);box-shadow:14px 17px 0 rgba(255,93,53,.24)}

/* Focus and reveal motion have physical pacing. */
.motion-reveal{transform:translate3d(0,54px,-70px) rotateX(3deg);filter:blur(3px);transition:opacity .9s var(--ease),transform 1.05s var(--ease),clip-path 1s var(--ease),filter .8s var(--ease)}
.motion-reveal.is-visible{transform:translate3d(0,0,0) rotateX(0);filter:none}
.tab-idle .future-atmosphere *,.tab-idle .arrival-orbit *{animation-play-state:paused!important}

@keyframes future-orbit{to{rotate:1turn}}
@keyframes future-drift{to{transform:translate3d(calc(var(--scene-x)*32px + 35px),calc(var(--scene-y)*18px - 22px),-120px) rotateY(73deg) rotateZ(2deg)}}
@keyframes future-signal{50%{opacity:.25;transform:scale(.55)}}
@keyframes arrival-ring{to{transform:rotate(1turn)}}

@media(pointer:coarse),(max-width:900px){
  .future-atmosphere i:nth-child(2),.world-axis{display:none}
  .world-stage>.section-heading,.data-lab .workspace,.playground,.research-layout,.research-toolkit,.experiments-list,.profile-grid,.connect>h2{transform:none!important}
  .arrival .name-display,.instrument,.case-page>h1,.resume-page>h1,.case-visual .visual{transform:none!important}
  .exhibit,.exhibit:nth-child(even){transform:none}

}

@media(max-width:600px){
  body{background-size:44px 44px}
  .future-atmosphere:before{height:55vh;bottom:-22vh;opacity:.6}

  .arrival .name-display span,.arrival .name-display span:first-child,.arrival .name-display span:nth-child(2){transform:none;text-shadow:0 1px 0 #a7aaa7,0 2px 0 #666b69,5px 8px 20px rgba(0,0,0,.38)}
  .instrument{box-shadow:0 20px 45px rgba(0,0,0,.24)}
  .instrument-surface .plane{transform:skewY(-7deg) translate3d(calc(var(--n)*6px),0,0);box-shadow:0 calc(var(--n)*5px) calc(var(--n)*10px) rgba(0,0,0,.25)}
  .exhibit .visual{transform:none!important;box-shadow:7px 8px 0 rgba(0,0,0,.5),15px 20px 44px rgba(0,0,0,.18)}
  .data-lab .workspace{box-shadow:none!important}
  .control-list,.play-preview,.architecture-note,.capability{transform:none;box-shadow:none}
  .case-visual .visual{box-shadow:8px 10px 0 rgba(255,93,53,.15),0 25px 55px rgba(0,0,0,.3)}
  .motion-reveal{transform:translateY(25px);filter:none}
}

.reduced .future-atmosphere i,.reduced .arrival-orbit i{animation:none!important}
.reduced .world-stage>.section-heading,.reduced .arrival .name-display,.reduced .instrument,.reduced .exhibit,.reduced .exhibit:nth-child(even),.reduced .data-lab .workspace,.reduced .playground,.reduced .research-layout,.reduced .research-toolkit,.reduced .experiments-list,.reduced .profile-grid,.reduced .connect>h2,.reduced .case-page>h1,.reduced .resume-page>h1,.reduced .case-visual .visual{transform:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){.future-atmosphere i,.arrival-orbit i{animation:none!important}.world-stage>.section-heading,.arrival .name-display,.instrument,.exhibit,.exhibit:nth-child(even),.data-lab .workspace,.playground,.research-layout,.research-toolkit,.experiments-list,.profile-grid,.connect>h2,.case-page>h1,.resume-page>h1,.case-visual .visual{transform:none!important;transition:none!important}}

/* Two self-contained art-directed workbenches. Their geometry is content, not ambience. */
.arrival.world-stage{background:#dcd9cf;color:#171a1c;--ink:#171a1c;--muted:#495053;--line:#9ca19d;--bg:#dcd9cf;border-bottom:12px solid #e26341;min-height:calc(100svh - 86px)}

.arrival .section-label,.arrival .hero-foot{border-color:#8d938f;color:#4a5351}.arrival .section-label{border-top:1px solid #8d938f;padding-top:16px}

.arrival .instrument{background:#192122;color:#eeeae0;border:1px solid #192122;box-shadow:18px 20px 0 #a8aba2;transform:perspective(1100px) rotateY(-7deg) rotateX(3deg) translateZ(58px)}
.arrival .instrument-tabs button{color:#d4d9d4}.arrival .instrument-tabs button[aria-pressed=true]{color:#f17b53}.arrival .instrument-surface p{color:#d2d6d0}
.arrival .visitor-paths{border-color:#999f99}.arrival .visitor-paths a{border-color:#999f99}.arrival .visitor-paths span{color:#4b5350}

@media(max-width:650px){.arrival.world-stage{min-height:0;border-bottom-width:8px}.arrival .instrument{transform:none;box-shadow:8px 10px 0 #a8aba2;margin:8px 8px 14px 0}.arrival .name-display{text-shadow:2px 3px 0 #f2eee7,4px 7px 0 rgba(34,39,38,.1)}}
@media(prefers-reduced-motion:reduce){.arrival .instrument{transform:none}}.reduced .arrival .instrument{transform:none}
.visual-morphslides{background:#171a1c;color:#f1ece4}.visual-logostudio{background:#e9e4d8;color:#192624}
.morph-thumb{position:absolute;inset:16% 7% 8%;border-top:1px solid #ba5340;display:flex;flex-direction:column;justify-content:space-between;transform:perspective(900px) rotateY(-8deg);padding:18px 12px}
