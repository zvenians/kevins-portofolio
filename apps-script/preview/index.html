.booking-visual strong,

  grid-column: span 2;
  background: #28372f;
  color: #f2eee5;
  font: 12px var(--mono);
}

.research-table {
  overflow: auto;
  margin: 20px 0;
  border: 1px solid var(--line);
}

.research-table th {
  background: #deddd6;
}

.research-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 25px;
}

.research-intake {
  display: grid;
  grid-template-columns: .9fr 1.1fr;
  gap: 50px;
  margin-top: 55px;
  padding: 40px;
  background: #171a1c;
  color: #eae9e4;
  scroll-margin-top: 100px;
}

.research-intake h3 {
  margin-bottom: 18px;
  font: italic clamp(32px, 4vw, 54px)/1 var(--serif);
}

.research-intake p {
  font-size: 13px;
}

.research-intake form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.research-intake label,
.method-helper label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font: 10px var(--mono);
}

.research-intake input,
.research-intake select,
.research-intake textarea {
  width: 100%;
}

.research-intake .wide {
  grid-column: span 2;
}

.method-helper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 28px;
}

.method-helper p {
  grid-column: span 2;
  padding-left: 14px;
  border-left: 1px solid var(--accent);
}

.intake-result {
  padding: 18px;
  border: 1px solid #474d4f;
}

.intake-result p {
  margin-bottom: 15px;
}

.services-studio {
  background: #111416;
}

.service-lanes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}

.service-lanes article {
  display: flex;
  flex-direction: column;
  min-height: 440px;
  padding: 32px;
  background: #111416;
}

.service-lanes h3 {
  margin: 15px 0;
  font: italic 36px/1 var(--serif);
}

.service-lanes p {
  font-size: 13px;
}

.service-lanes ul {
  margin: 28px 0;
  padding-left: 18px;
  color: #c9cdd0;
  font-size: 12px;
}

.service-lanes li {
  margin: 9px 0;
}

.service-lanes small {
  margin-top: auto;
  padding: 20px 0;
  color: var(--muted);
  font-size: 10px;
}

.work-steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 55px;
  border-top: 1px solid var(--line);
}

.work-steps > .eyebrow {
  grid-column: 1 / -1;
  margin: 20px 0;
}

.work-steps div {
  padding: 22px 20px 22px 0;
  border-right: 1px solid var(--line);
}

.work-steps div + div {
  padding-left: 20px;
}

.work-steps div:last-child {
  border-right: 0;
}

.work-steps b,
.work-steps strong {
  display: block;
}

.work-steps b {
  margin-bottom: 25px;
  color: var(--accent);
  font: 10px var(--mono);
}

.work-steps strong {
  margin-bottom: 10px;
  font-size: 20px;
}

.work-steps p {
  font-size: 11px;
}

.booking-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.booking-form label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font: 10px var(--mono);
}

.booking-form fieldset {
  grid-column: span 2;
  margin: 0;
  padding: 15px;
  border: 1px solid var(--line);
}

.booking-form legend {
  padding: 0 7px;
  font: 10px var(--mono);
}

.slot-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.slot-grid label {
  display: block;
}

.slot-grid input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.slot-grid span {
  display: block;
  padding: 9px 12px;
  border: 1px solid var(--line);
}

.slot-grid input:checked + span {
  background: var(--accent);
  color: #111;
  border-color: var(--accent);
}

.booking-summary {
  margin-top: 18px;
  padding: 20px;
  border-left: 2px solid var(--accent);
}

.booking-summary h3 {
  margin-bottom: 18px;
}

.booking-summary dl {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.booking-summary dt {
  color: var(--muted);
  font: 9px var(--mono);
}

.booking-summary dd {
  margin: 4px 0 0;
}

.booking-summary p {
  margin-top: 18px;
}

.data-proof {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 30px;
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
}

.data-proof div {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.data-proof small {
  padding: 12px;
  background: #dfded7;
  font: 9px var(--mono);
}

@media (max-width: 900px) {
  .research-intake {
    grid-template-columns: 1fr;
  }

  .service-lanes {
    grid-template-columns: 1fr;
  }

  .service-lanes article {
    min-height: auto;
  }

  .work-steps {
    grid-template-columns: 1fr 1fr;
  }

  .data-proof {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  .research-intake {
    gap: 30px;
    padding: 24px 18px;
  }

  .research-intake form,
  .method-helper,
  .booking-form {
    grid-template-columns: 1fr;
  }

  .research-intake .wide,
  .method-helper p,
  .booking-form fieldset {
    grid-column: auto;
  }

  .work-steps,
  .data-proof div,
  .booking-summary dl {
    grid-template-columns: 1fr;
  }

  .work-steps div,
  .work-steps div + div {
    padding: 18px 0;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
}

.visual-commerce {
  background: #d9d5ca;
  color: #171a1c;
}

.commerce-visual {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  max-width: 430px;
  min-height: 230px;
  margin: 25px auto 0;
  border: 1px solid #8d8d86;
  background: #f0eee8;
}

.commerce-visual-copy {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 22px;
}

.commerce-visual-copy span,
.commerce-visual-copy small {
  font: 9px var(--mono);
  letter-spacing: .06em;
}

.commerce-visual-copy b {
  font: italic 34px/1 var(--serif);
}

.commerce-visual-receipt {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 22px;
  background: #26352d;
  color: #f0eee8;
  font: 9px var(--mono);
}

.commerce-visual-receipt strong {
  font: 24px 'DM Sans', sans-serif;
  letter-spacing: -.05em;
}

.commerce-demo {
  overflow: hidden;
  border: 1px solid var(--line);
  background: #ebe9e2;
  color: #171a1c;
  --commerce-line: #b9b8b1;
  --commerce-paper: #f6f4ee;
  --commerce-ink: #171a1c;
  --commerce-muted: #626866;
  --commerce-accent: #b6492f;
}

.demo-case-copy {
  grid-template-columns: 1fr;
}

.demo-case-copy > h2 {
  margin-bottom: 20px;
}

.commerce-demo input,
.commerce-demo select,
.commerce-demo textarea,
.commerce-demo button {
  color: var(--commerce-ink);
  border-color: var(--commerce-line);
}

.commerce-demo select option {
  background: var(--commerce-paper);
  color: var(--commerce-ink);
}

.commerce-notice,
.commerce-store-head,
.commerce-toolbar,
.commerce-cart-head,
.commerce-order-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.commerce-notice {
  padding: 12px 20px;
  border-bottom: 1px solid var(--commerce-line);
  background: #202522;
  color: #eeece5;
  font: 9px var(--mono);
  letter-spacing: .05em;
}

.commerce-store-head {
  padding: 34px;
  border-bottom: 1px solid var(--commerce-line);
}

.commerce-store-head h3,
.commerce-checkout h3,
.commerce-blueprint h3 {
  margin: 0;
  font: 500 clamp(34px, 5vw, 62px)/.98 'DM Sans', sans-serif;
  letter-spacing: -.055em;
}

.commerce-store-head h3 i,
.commerce-checkout h3 i,
.commerce-blueprint h3 i {
  font-family: var(--serif);
  font-weight: 400;
}

.commerce-store-head button {
  min-width: 110px;
  background: #202522;
  color: #eeece5;
  border: 0;
}

.commerce-store-head button b {
  display: inline-grid;
  width: 24px;
  height: 24px;
  margin-left: 9px;
  place-items: center;
  border-radius: 50%;
  background: var(--commerce-accent);
  color: #fff;
}

.commerce-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.8fr) minmax(300px, .8fr);
}

.commerce-catalog {
  min-width: 0;
  padding: 28px;
  border-right: 1px solid var(--commerce-line);
}

.commerce-toolbar {
  align-items: end;
  margin-bottom: 20px;
}

.commerce-toolbar label,
.commerce-shipping,
.commerce-voucher label,
.commerce-checkout label,
.commerce-product-copy label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font: 9px var(--mono);
  letter-spacing: .03em;
}

.commerce-toolbar label:first-child {
  flex: 1;
}

.commerce-toolbar input,
.commerce-toolbar select {
  width: 100%;
  background: var(--commerce-paper);
}

.commerce-categories {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.commerce-categories button {
  padding: 8px 11px;
  font-size: 10px;
}

.commerce-categories button[aria-pressed=true] {
  background: #202522;
  color: #eeece5;
  border-color: #202522;
}

.commerce-result-count {
  margin: 20px 0 12px;
  color: var(--commerce-muted);
  font: 9px var(--mono);
}

.commerce-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.commerce-product {
  min-width: 0;
  border: 1px solid var(--commerce-line);
  background: var(--commerce-paper);
}

.commerce-product-art {
  display: flex;
  position: relative;
  min-height: 230px;
  flex-direction: column;
  justify-content: space-between;
  padding: 19px;
  overflow: hidden;
  isolation: isolate;
}

.commerce-product-art::after {
  content: '';
  position: absolute;
  right: -22px;
  bottom: -40px;
  width: 150px;
  height: 190px;
  border: 1px solid currentColor;
  border-radius: 48% 48% 18% 18%;
  transform: rotate(-13deg);
  opacity: .45;
  z-index: -1;
}

.commerce-product-art span,
.commerce-product-art i {
  font: 9px var(--mono);
}

.commerce-product-art b {
  max-width: 75%;
  font: italic clamp(38px, 5vw, 68px)/.85 var(--serif);
}

.tone-sand { background: #d7c9b3; color: #342f29; }
.tone-clay { background: #b9664d; color: #f4eee5; }
.tone-steel { background: #aab4b7; color: #1e292c; }
.tone-forest { background: #31463a; color: #e9e5da; }
.tone-ink { background: #262b2e; color: #eeeae1; }
.tone-oat { background: #d8d0bc; color: #35332d; }

.commerce-product-copy {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px 14px;
  padding: 18px;
}

.commerce-product-copy small,
.commerce-product-copy label,
.commerce-product-copy button {
  grid-column: 1 / -1;
}

.commerce-product-copy small {
  color: var(--commerce-muted);
  font: 8px var(--mono);
}

.commerce-product-copy h4 {
  font-size: 18px;
  line-height: 1.15;
}

.commerce-product-copy strong {
  align-self: start;
  font-size: 12px;
  white-space: nowrap;
}

.commerce-product-copy select {
  width: 100%;
}

.commerce-product-copy button {
  background: #202522;
  color: #eeece5;
  border-color: #202522;
}

.commerce-cart {
  position: sticky;
  top: 0;
  align-self: start;
  max-height: 100vh;
  padding: 26px;
  overflow: auto;
  background: #dfddd5;
}

.commerce-cart-head {
  padding-bottom: 15px;
  border-bottom: 1px solid var(--commerce-line);
}

.commerce-cart-head button {
  border: 0;
  padding: 5px;
  font-size: 10px;
}

.commerce-cart-empty {
  padding: 40px 0;
}

.commerce-cart-empty span,
.commerce-shipping small,
.commerce-voucher-note {
  color: var(--commerce-muted);
  font-size: 10px;
}

.commerce-cart-lines article {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  padding: 17px 0;
  border-bottom: 1px solid var(--commerce-line);
}

.commerce-cart-lines b,
.commerce-cart-lines small,
.commerce-cart-lines span {
  display: block;
}

.commerce-cart-lines b {
  font-size: 12px;
}

.commerce-cart-lines small {
  color: var(--commerce-muted);
  font: 9px var(--mono);
}

.commerce-cart-lines span {
  margin-top: 5px;
  font-size: 11px;
}

.commerce-quantity {
  display: grid;
  grid-template-columns: 30px 28px 30px;
  align-items: center;
  text-align: center;
}

.commerce-quantity button {
  width: 30px;
  height: 30px;
  padding: 0;
}

.commerce-voucher {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 7px;
  margin-top: 22px;
}

.commerce-voucher input {
  width: 100%;
  text-transform: uppercase;
}

.commerce-voucher-note {
  min-height: 32px;
  margin: 7px 0 16px;
}

.commerce-shipping select {
  width: 100%;
}

.commerce-totals {
  margin: 24px 0;
  padding-top: 16px;
  border-top: 1px solid var(--commerce-line);
}

.commerce-totals div {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin: 8px 0;
  font-size: 11px;
}

.commerce-totals dd {
  margin: 0;
}

.commerce-totals .commerce-grand-total {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid var(--commerce-line);
  font-size: 18px;
}

.commerce-checkout-jump {
  width: 100%;
}

.commerce-empty {
  grid-column: 1 / -1;
  min-height: 200px;
  padding: 50px 20px;
  border: 1px dashed var(--commerce-line);
  text-align: center;
}

.commerce-checkout {
  display: grid;
  grid-template-columns: .85fr 1.15fr;
  gap: 50px;
  padding: 48px 34px;
  border-top: 1px solid var(--commerce-line);
  background: #202522;
  color: #eeece5;
}

.commerce-checkout p {
  margin-top: 20px;
  font-size: 12px;
}

.commerce-checkout form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.commerce-checkout input,
.commerce-checkout select,
.commerce-checkout textarea {
  width: 100%;
  color: #eeece5;
  border-color: #525955;
}

.commerce-checkout select option {
  background: #202522;
  color: #eeece5;
}

.commerce-checkout .wide {
  grid-column: 1 / -1;
}

.commerce-checkout .consent {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: start;
}

.commerce-checkout .consent input {
  width: auto;
  margin-top: 2px;
}

.commerce-order {
  grid-column: 1 / -1;
  margin-top: 10px;
  padding: 25px;
  border: 1px solid #525955;
}

.commerce-order-head h3 {
  font-size: 32px;
}

.commerce-order-head strong {
  color: #ff8968;
  font-size: 22px;
}

.commerce-order-lines {
  display: grid;
  gap: 7px;
  margin: 20px 0;
  padding: 15px 0;
  border-top: 1px solid #525955;
  border-bottom: 1px solid #525955;
}

.commerce-order-lines span {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font-size: 11px;
}

.commerce-blueprint {
  padding: 48px 34px;
  border-top: 1px solid var(--commerce-line);
}

.commerce-blueprint-head {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 30px;
}

.commerce-blueprint-head .eyebrow {
  grid-column: 1 / -1;
}

.commerce-blueprint-head p {
  max-width: 480px;
  align-self: end;
}

.commerce-sheet-map {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  margin: 35px 0;
  border: 1px solid var(--commerce-line);
  background: var(--commerce-line);
}

.commerce-sheet-map article {
  display: grid;
  min-height: 150px;
  padding: 20px;
  background: var(--commerce-paper);
}

.commerce-sheet-map b {
  color: var(--commerce-accent);
  font: 9px var(--mono);
}

.commerce-sheet-map span {
  align-self: end;
  font-size: 20px;
}

.commerce-sheet-map small {
  color: var(--commerce-muted);
  font-size: 10px;
}

.commerce-flow {
  display: grid;
  grid-template-columns: repeat(7, auto);
  align-items: center;
  gap: 10px;
  padding: 20px;
  border: 1px solid var(--commerce-line);
  font: 10px var(--mono);
}

.commerce-flow span {
  padding: 12px;
  background: var(--commerce-paper);
}

.commerce-flow b {
  color: var(--commerce-accent);
}

.commerce-blueprint > .disclosure {
  max-width: 850px;
  margin-top: 20px;
}

@media (max-width: 980px) {
  .commerce-layout,
  .commerce-checkout {

  .commerce-sheet-map {

  }

  }

  }

.field-category-progress {
  display: grid;
  grid-template-columns: repeat(4, 1fr);

  margin: 20px 0;
  border: 1px solid var(--line);

}

  grid-template-columns: 1fr auto;

/* Public UI system: one type family, neutral surfaces, generous composition. */
body.clean-ui {
 --sans:var(--system);--display:var(--system);--serif:var(--system);--mono:var(--system);
 --clean-paper:#f5f5f7;--clean-white:#fff;--clean-ink:#24252b;--clean-muted:#62646e;
 --clean-line:#dedee5;--clean-accent:#69528f;--clean-radius:20px;
}
body.clean-ui *,body.clean-ui svg text {font-family:var(--system)!important}
body.clean-ui .arrival-editorial h1 em {font-family:var(--system)!important;font-style:normal;font-weight:350;font-size:1em;letter-spacing:-.065em}
body.clean-ui :is(h2,h3,h4) {font-weight:550;letter-spacing:-.035em;line-height:1.12}
body.clean-ui :is(h2,h3,h4) i {font-family:inherit!important;font-style:normal;font-weight:inherit}
body.clean-ui :is(p,li) {line-height:1.7}
body.clean-ui :is(.eyebrow,.section-label,.exhibit-meta,.micro,.edition-label) {font-size:11px;line-height:1.5;letter-spacing:.055em}
body.clean-ui :is(button,input,select,textarea) {font-size:14px;line-height:1.4}
body.clean-ui :is(input,select,textarea) {border:1px solid #d0d1d9;border-radius:10px;min-height:46px;padding:12px 14px;box-shadow:none}
body.clean-ui input[type=checkbox],body.clean-ui input[type=radio] {min-height:0;padding:0;width:18px;height:18px;accent-color:#69528f}
body.clean-ui :is(input,select,textarea):focus-visible {outline:3px solid #9d89bd;outline-offset:3px}
body.clean-ui button {border-radius:10px;transition:background .2s,color .2s,box-shadow .2s}
body.clean-ui button:disabled {opacity:.5;cursor:not-allowed}
body.clean-ui :is(.solid-button,.dark-button,.ink-button) {border-radius:10px;padding:13px 20px!important;background:#34313c!important;color:#fff!important;border-color:#34313c!important}
body.clean-ui :is(.case-links,.desk-actions,.world-playback,.gallery-categories,.lab-tabs) button {min-height:44px}
body.clean-ui .header {min-height:72px}
body.clean-ui .header :is(a,button,select) {font-size:13px}
body.clean-ui .header .identity b {font-size:23px}

/* Main journey. Two stable columns replace uneven sizes and scattered spacing. */
body.clean-ui main>section:not(.arrival) {padding:110px max(6%,calc((100vw - 1240px)/2));border:0}
body.clean-ui .section-label {border:0;padding:0;margin-bottom:32px}
body.clean-ui :is(.section-heading,.gallery-section-head) {margin-bottom:44px;padding:0;border:0;gap:50px}
body.clean-ui :is(.section-heading,.gallery-section-head) h2 {font-size:clamp(34px,4.1vw,58px);font-weight:550;line-height:1.09;letter-spacing:-.05em}
body.clean-ui .section-heading h2 {max-width:18ch}
body.clean-ui :is(.section-heading,.gallery-section-head) p {font-size:16px;line-height:1.65;max-width:40ch}
body.clean-ui #field {--bg:#f5f5f7;--ink:#24252b;--muted:#62646e;--line:#dedee5;background:#f5f5f7}
body.clean-ui #field .collection-switch {display:flex;flex-wrap:wrap;gap:6px;border:0;background:#e9e9ef;border-radius:13px;padding:5px;width:fit-content;margin-bottom:24px}
body.clean-ui #field .collection-switch button {font-size:13px;padding:12px 18px;border:0!important;border-radius:9px;color:#60616c}
body.clean-ui #field .collection-switch button[aria-pressed=true] {color:#292731;background:#fff;box-shadow:0 2px 7px #17141f0c}
body.clean-ui #field .toolbar {padding:0 0 16px;gap:16px;border:0;align-items:center}
body.clean-ui #field .filters {display:flex;flex-wrap:wrap;gap:4px 8px}

body.clean-ui #field .filters button[aria-pressed=true] {background:#e7e2ed;color:#4e3b6c}

body.clean-ui #field .search-row input {width:min(100%,420px);background:#fff;font-size:14px}
body.clean-ui #field .exhibition.atlas {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 30px}

body.clean-ui #field .exhibit h3 {font-size:24px;margin:12px 0 10px;letter-spacing:-.035em}
body.clean-ui #field .exhibit p {font-size:14px;max-width:50ch}

body.clean-ui #field .exhibition.index .exhibit {padding:24px 0;margin:0!important}
body.clean-ui #field .exhibition.index .visual {height:90px;box-shadow:none;transform:none!important}

/* Studio: a dimensional installation, followed by large clean previews. */
body.clean-ui #studio {--ink:#f6f6f8;--muted:#b9bac5;background:#191a1f;color:#f6f6f8}

body.clean-ui .gallery-template>div:last-child {border:0;margin:0;padding:24px 2px 0}
body.clean-ui #studio .gallery-template h3 {font-size:24px;line-height:1.2;margin:8px 0 10px;color:#f6f6f8}
body.clean-ui #studio .gallery-template p {font-size:14px;color:#b9bac5;line-height:1.6;max-width:48ch}
body.clean-ui .gallery-template>div>span {font-size:10px;letter-spacing:.06em}
body.clean-ui .gallery-disclosure {max-width:74ch;font-size:12px;line-height:1.7;margin-top:44px}
body.clean-ui .demo-dom-preview:after {content:none}
.studio-sculpture {grid-column:2;grid-row:1/3;align-self:center;display:block;width:100%;padding:0!important;border:0!important;background:none!important;color:#c7c1d2!important;text-align:left;--sculpture-angle:-18deg}
.sculpture-space {display:block;height:340px;perspective:1000px;position:relative;isolation:isolate}
.sculpture-pages {position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--sculpture-angle)) rotateX(14deg);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}

spondence. No confidential administrative records are reproduced.","tradeoff":"Sheets is familiar to operators, but relational integrity, concurrent edits, and authorization require deliberate application logic.","evidence":["admin/js/core.js","admin/js/features.js","api/gas.js","apps-script/Code.gs","scripts/test-access-boundaries.js"],"id":"majelis-galilea","featured":true,"order":2,"visibility":"public","updatedAt":"2026-10-22","repositoryUrl":"https://github.com/zvenians/majelis-galilea","revision":"748021b9211b0ac2edc45c7fa15d13b5a4235f70","coverUrl":"https://portfolio-kevins.vercel.app/project-shots/majelis-galilea.webp"},{"slug":"naomi-rouli","title":"The pace of a story.","name":"Naomi Rouli","summary":"An editorial study in typography, quiet movement, and the space between chapters.","category":"Creative Experiments","disciplines":["UI/UX","Visual Communication"],"technologies":["HTML","CSS","JavaScript","Firebase Hosting"],"status":"Real Project","visual":"editorial","liveUrl":"https://naomirouli.web.app","challenge":"A personal story needs pacing and emotional clarity without turning every screen into another effect.","approach":"Structure the experience into nine scenes. Let typography, composition, and chapter changes carry the narrative.","implementation":"Vanilla JavaScript uses IntersectionObserver for chapter navigation and pointer capture for a horizontal photo rail. CSS custom properties maintain the editorial system.","outcome":"The public repository supports the interaction techniques described here. This exhibit uses an original typographic illustration; private photographs and personal letters are not reused.","tradeoff":"The interface is intentionally bespoke. Reusing its technical patterns is more appropriate than republishing its personal content.","evidence":["script.js","style.css","index.html","firebase.json"],"id":"naomi-rouli","featured":true,"order":3,"visibility":"public","updatedAt":"2026-10-22","repositoryUrl":"https://github.com/z lementation":"At the audited revision, this repository contains a README only. The active implementations live in the three dedicated Galilea repositories.","outcome":"Useful as a timeline marker, not evidence of a functioning prototype.","tradeoff":"No executable application was found in this repository.","evidence":["README.md"],"id":"galilea-origins","featured":false,"order":5,"visibility":"public","updatedAt":"2026-10-22","repositoryUrl":"https://github.com/zvenians/galilea","revision":"b3b1f0a586aefc29fe7b4c2718dd27f0d67ee188"},{"slug":"ruang-temu-booking-demo","title":"Booking, without the back-and-forth.","name":"Ruang Temu — Booking Demo","summary":"A local-service booking demo that helps customers choose a service, pick a time, and send one clear booking summary.","category":"Websites","disciplines":["Web Engineering","UI/UX"],"technologies":["JavaScript","Responsive UI","Form Validation","Local State","WhatsApp Flow"],"status":"Interactive Demo","visual":"booking","challenge":"Small businesses often handle bookings through open-ended chat. Customers ask for details one by one, while the owner has to copy schedules and service details by hand.","approach":"Turn the conversation into a simple flow: choose a service, date, and time, then review everything in one place. WhatsApp stays familiar, but the message arrives complete and easier to process.","implementation":"The demo runs locally in the browser with form validation, changing time slots, a booking summary, and clear feedback. Every name, schedule, and transaction is fictional and disconnected from a real business.","outcome":"Visitors can try the booking flow from the first choice to the final summary. It proves the interface logic and responsive behavior; it is not presented as a client production system.","tradeoff":"Payments, customer accounts, a production database, and an owner calendar are intentionally outside this demo. Those features need real operating rules before they should be built.","evidence":["Working service and time-slot selection","Name, date, and contact validation","A booking summary ready to share","Responsive behavior without real business data"],"id":"ruang-temu-booking-demo","featured":true,"order":6,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"sera-goods-commerce-demo","title":"A small shop with serious order logic.","name":"SERA Goods — Commerce Demo","summary":"A detailed storefront demonstration with product discovery, variants, stock-aware cart logic, vouchers, shipping choices, and a clear checkout review.","category":"Websites","disciplines":["Web Engineering","Business Systems","UI/UX"],"technologies":["Google Apps Script","Google Sheets","JavaScript","Cart State","Voucher Rules","Shipping Logic"],"status":"Interactive Demo","visual":"commerce","challenge":"A small online shop needs more than attractive product cards. Prices, variants, stock, vouchers, shipping, and order details have to stay consistent from the first browse to the final confirmation.","approach":"Build one short buying flow around the decisions that matter: find a product, choose the right variant, understand the total, and review the order before anything is submitted. Administrative complexity stays behind the storefront.","implementation":"The public exhibit runs as a safe local simulation with a searchable catalogue, category filters, variant-aware stock, quantity controls, voucher validation, configurable shipping, and checkout validation. The production blueprint maps Products, Variants, Vouchers, Shipping, Orders, and Order Items to Google Sheets, with Apps Script rechecking prices and stock before writing an order.","outcome":"Visitors can complete the full storefront journey and inspect the business rules behind it. All products, prices, stock, addresses, vouchers, and order numbers are fictional demonstration data.","tradeoff":"The exhibit does not process payments, contact a courier API, upload real products, or save customer details. A production version would require authenticated administration, Drive media storage, server-side order locking, rate limits, and verified payment or shipping integrations.","evidence":["Searchable and filterable product catalogue","Variant and stock-aware cart calculations","Voucher eligibility and discount limits","Shipping selection and final checkout review","Google Sheets and Apps Script production data model"],"id":"sera-goods-commerce-demo","featured":true,"order":7,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"operations-decision-workbench","title":"A decision should leave a trail.","name":"Operations Decision Workbench","summary":"A procurement and operations demonstration that compares vendor offers with editable weights, transparent formulas, and an exportable decision workbook.","category":"Data & Automation","disciplines":["Data & Automation","Business Systems","Operational Systems"],"technologies":["Excel","Google Sheets","Google Apps Script","Weighted Scoring","Formula Auditing","XLSX Export"],"status":"Interactive Demo","visual":"operations","challenge":"Choosing a supplier from several quotations is rarely a lowest-price decision. Lead time, warranty, documentation, technical compliance, and approval notes need to stay visible without turning the process into an untraceable spreadsheet.","approach":"Keep the decision model small enough to inspect. Each criterion has an explicit weight, every vendor score uses the same normalization rule, and the current recommendation changes as the priorities change.","implementation":"The browser demonstration recalculates four fictional vendor offers in real time. The downloadable Excel workbook separates source quotations, settings, and formula-based scoring so a reviewer can trace the result instead of trusting a fixed dashboard number. The wider Data Lab also includes field validation, maintenance records, reconciliation, scheduling, budgets, and cleanup workflows.","outcome":"Visitors can change the decision weights, compare commercial and technical trade-offs, and download a functioning workbook with editable inputs and formulas. No real vendor, quote, or company record is used.","tradeoff":"Weighted scoring helps structure a review but cannot approve a purchase. A production workflow still needs procurement policy, authorized reviewers, document verification, conflict checks, and controlled access to actual quotations.","evidence":["Editable price, lead-time, warranty, and compliance weights","Normalized multi-criteria vendor scoring","Formula-based XLSX decision workbook","Clear distinction between recommendation and approval"],"id":"operations-decision-workbench","featured":true,"order":8,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"research-practice-toolkit","title":"Research support that shows its reasoning.","name":"Research Practice Toolkit","summary":"Eight local research tools for method selection, sample planning, assumption review, result tables, questionnaire structure, citations, defense practice, and revision tracking.","category":"Data & Automation","disciplines":["Data & Automation","Research Support","Technical Documentation"],"technologies":["SPSS Planning","Statistical Reasoning","JavaScript","CSV Export","Local State","Research Writing"],"status":"Interactive Demo","visual":"researchtools","challenge":"Research support can become vague or irresponsible when it only promises a finished answer. Students need to see how a method connects to a question, what assumptions need attention, and where their own academic judgment is still required.","approach":"Turn the support process into inspectable tools. Each module explains its rule, exposes the inputs, gives a cautious output, and names what it cannot decide. The interface supports learning and revision instead of replacing the student.","implementation":"Eight browser-based modules cover method advising, survey sample estimates, assumption diagnostics, formatted result tables, questionnaire blueprints, author-year consistency checks, defense-question practice, and a locally saved revision plan. Sample exports are generated without uploading research data.","outcome":"Visitors can test a research decision from planning through defense preparation and download selected working files. All examples are fictional, and all generated writing is labeled as a draft for student and supervisor review.","tradeoff":"The toolkit does not run SPSS, verify source authenticity, approve a methodology, write a thesis, fabricate data, or guarantee an academic result. Discipline-specific decisions still require qualified supervision and the student’s own work.","evidence":["Research-method decision helper","Finite-population sample-size calculation","Assumption and influence diagnostics","Questionnaire and result-table CSV exports","Citation consistency review","Defense practice and local revision tracker"],"id":"research-practice-toolkit","featured":true,"order":9,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"asset-field-companion","title":"The network can wait. The observation should not.","name":"Asset Field Companion","summary":"An offline-first field workflow for finding an asset, recording its condition, attaching evidence, and synchronizing a reviewable observation later.","category":"Business Systems","disciplines":["Operational Systems","Web Engineering","Data & Automation"],"technologies":["Progressive Web App","Local Queue","Google Apps Script","Google Sheets","Responsive Forms"],"status":"Interactive Demo","visual":"fieldcompanion","challenge":"Field verification does not always happen beside a reliable connection. A useful tool has to preserve the inventory context, make evidence easy to record on a phone, and show clearly what is local, queued, or synchronized.","approach":"Treat every observation as a small controlled handover. The interface keeps the expected record beside the actual condition, saves work locally first, and lets the operator decide when the queue is ready to synchronize.","implementation":"The demonstration supports asset selection, field condition, observed location, notes, optional photo selection, an offline switch, a persistent local queue, and simulated synchronization. A production version would use a service worker and authenticated Apps Script writes into controlled Sheets and Drive folders.","outcome":"Visitors can complete a realistic mobile field flow and see the difference between a saved observation and a synchronized record. All asset numbers, locations, and departments are fictional.","tradeoff":"The public demo does not upload photos, request precise location, scan a real QR code, or write to production storage. Those capabilities require clear consent, authentication, retention rules, and conflict handling.","evidence":["Persistent browser-local observation queue","Offline and restored-network states","Condition, location, note, and evidence workflow","Explicit sync status and production boundary"],"id":"asset-field-companion","featured":true,"order":10,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"research-data-preparation-studio","title":"Good analysis begins before the Analyze menu.","name":"Research Data Preparation Studio","summary":"A hands-on preparation desk for missing codes, duplicate respondents, reverse scoring, implausible values, codebooks, and SPSS-ready working files.","category":"Data & Automation","disciplines":["Research Support","Data & Automation","Technical Documentation"],"technologies":["SPSS Syntax","CSV Export","Codebook Design","Data Validation","JavaScript"],"status":"Interactive Demo","visual":"dataprep","challenge":"Statistical output can look precise even when the input still contains duplicate IDs, hidden missing-value codes, incorrectly scored items, or impossible values. Those decisions need to be recorded before testing begins.","approach":"Keep the raw import unchanged and create a separate working copy. Every correction is visible in a preparation log, while the codebook explains what each variable means and how it should be treated.","implementation":"The browser tool identifies a duplicate respondent, converts a chosen missing code, optionally reverse-scores Q2R, calculates a scale mean, flags an implausible age, and exports both a prepared CSV and starter SPSS syntax.","outcome":"Visitors can move a small fictional survey from raw rows to a documented analysis-ready copy without uploading anything. The generated files remain editable and clearly labeled as demonstrations.","tradeoff":"The tool does not determine whether a response should be deleted, validate an instrument, replace subject-matter judgment, or open proprietary SPSS files. A real engagement begins with the actual codebook and research protocol.","evidence":["Raw and prepared views remain separate","Missing-code and duplicate handling","Reverse scoring and computed scale mean","CSV, codebook, and SPSS syntax outputs"],"id":"research-data-preparation-studio","featured":true,"order":11,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"document-automation-studio","title":"A document is easier to trust when its source is clear.","name":"Document Automation Studio","summary":"A controlled Sheets-to-document workflow for references, structured fields, draft status, PDF generation, and an archive-ready activity record.","category":"Business Systems","disciplines":["Document Systems","Data & Automation","Workflow Design"],"technologies":["Google Apps Script","Google Sheets","Google Docs","Google Drive","PDF Generation"],"status":"Interactive Demo","visual":"documents","challenge":"Recurring reports and letters are often copied from an old file until their reference, wording, or approval state becomes uncertain. The document needs a dependable source and a visible lifecycle.","approach":"Separate structured data from presentation. A small form supplies the controlled fields, the document preview makes the result inspectable, and the archive log records what would be generated and where it belongs.","implementation":"The demonstration builds four document types from editable inputs, refreshes an A4-style draft, generates a real sample PDF, and exports a compact archive log. The production blueprint maps the same flow to Sheets, Docs templates, Apps Script, and Drive.","outcome":"Visitors can produce a usable fictional report while seeing its reference, draft state, owner, generation date, and archive destination. No confidential company document is reproduced.","tradeoff":"A generated draft is not an approval. Production use still requires authorized templates, access controls, version retention, naming policy, and a clear sign-off process.","evidence":["Structured document input","Controlled A4-style preview","Real client-side PDF output","Archive log with reference and status"],"id":"document-automation-studio","featured":true,"order":12,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"sera-commerce-operations-console","title":"Checkout is only the beginning of the order.","name":"SERA Commerce Operations Console","summary":"The back-office half of the SERA storefront: fulfilment stages, stock movements, reorder signals, return review, margin context, and a daily close.","category":"Digital Products","disciplines":["Business Systems","Web Engineering","Data & Automation"],"technologies":["Inventory Ledger","Order Fulfilment","Google Sheets","Google Apps Script","CSV Export"],"status":"Interactive Demo","visual":"commerceops","challenge":"A polished storefront does not explain what happens after payment. Stock changes, picking, packing, shipping, returns, and end-of-day review need consistent rules behind the public interface.","approach":"Use a compact operations desk instead of another marketing dashboard. Orders move through explicit stages, every stock adjustment has a reason, and low-stock items remain visible during the daily close.","implementation":"The local e tables, stable project URLs, and demonstration disclosure. It deliberately does not invent Lighthouse or Core Web Vitals scores.","outcome":"Visitors see how quality work is documented instead of receiving an unsupported score. The responsive sample also makes layout behavior observable rather than replacing it with screenshots.","tradeoff":"DOM checks cannot replace assistive-technology testing, real-user metrics, slow-network trials, or cross-browser QA. Those results should only be published after the corresponding test has actually run.","evidence":["Live semantic document checks","Responsive width instrument","Copyable release report","Explicit measurement limitations"],"id":"quality-evidence-room","featured":false,"order":14,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"project-brief-scope-builder","title":"A useful brief before a confident estimate.","name":"Project Brief & Scope Builder","summary":"A practical intake tool for websites, data work, research support, and automation—without guessing a price or promising an unreviewed deadline.","category":"Business Systems","disciplines":["Workflow Design","Client Communication","Information Architecture"],"technologies":["Form Validation","Structured Briefs","WhatsApp Handoff","Email Handoff","Local Processing"],"status":"Interactive Demo","visual":"scopebuilder","challenge":"A first message often contains either too little information or a long list of disconnected features. Both make it difficult to understand the actual problem, handover, and boundary.","approach":"Ask only for the choices that improve the first conversation: work area, current stage, working environment, useful deliverables, the immediate problem, and what should stay outside the first scope.","implementation":"The builder changes its handover options by service area, validates the brief, creates a readable summary, copies it to the clipboard, and prepares a WhatsApp or email handoff using the published contact settings. Nothing is stored by the page.","outcome":"A prospective client can arrive with an unclear need and leave with a concise message that Kevin can review. Cost and timing remain discussion points instead of fabricated instant calculations.","tradeoff":"The generated brief is not a contract, proposal, quotation, or technical discovery. Sensitive files should only be shared through an agreed channel after the initial review.","evidence":["Service-specific handover choices","Clear scope-boundary prompt","Copyable structured brief","Contact handoff without public data storage"],"id":"project-brief-scope-builder","featured":false,"order":15,"visibility":"public","updatedAt":"2026-10-23"},{"id":"morph-presentation-studio","slug":"morph-presentation-studio","title":"Give the idea room to move.","name":"Morph Presentation Studio","summary":"An editable slide sequence where the same objects move between layouts—an interactive study of presentation pacing.","category":"Visual Communication","disciplines":["Presentation Design","Motion","Typography"],"technologies":["HTML","CSS Transitions","JavaScript","SVG Export"],"status":"Interactive Demo","visual":"morphslides","featured":false,"order":16,"visibility":"public","updatedAt":"2026-10-25","challenge":"Dense slides make an audience read instead of listen. Movement can clarify the relationship between ideas when it follows the same visual objects.","approach":"Keep three slides connected by one numbered marker, headline, and geometric object. Let visitors change the wording and choose a visual direction before playing the sequence.","implementation":"A browser-local stage changes the layout of persistent DOM elements across three scenes. CSS interpolates their position, scale, shape, and color; reduced-motion removes the tween. Export creates an SVG of the selected frame, not a PowerPoint file.","outcome":"Visitors can edit copy, switch themes, step between slides, autoplay, and download an SVG still. This demonstrates slide direction ELD REVIEW</b><hr>31 / 51 verified<br><br><b>Next action</b><br>Confirm pump location.</div></div></article><article class="experiment"><span class="eyebrow">03 / PRESENTATION — DEMONSTRATION</span><h3>One thought. Enough space.</h3><p>A presentation study that adapts to a fullscreen display.</p><button id="presentation-open" style="margin-top:20px">Open presentation ↗</button></article><article class="experiment"><span class="eyebrow">04 / WORKFLOW — CONCEPT</span><h3>A smaller, clearer community.</h3><p>A Discord information architecture study: announcements, shared chat, and temporary two-person voice rooms. This is a workflow concept, not a connected bot.</p><details style="margin-top:20px"><summary>Inspect the workflow</summary><p>Join a voice lobby → bot creates a private room → cap at two members → remove room when empty. Permissions and bot hosting still require implementation.</p></details></article></div></section><section id="profile">${sectionLabel('05','THE HUMAN BEHIND THE SYSTEM','KEVIN SIMATUPANG')}<div class="profile-grid"><div><div class="profile-mark">k↗</div><span class="mono">BASED IN BALIKPAPAN<br>EAST KALIMANTAN, INDONESIA</span></div><div class="profile-copy"><h2>Curiosity.<br><i>With structure.</i></h2><p>I like the moment a complicated process starts making sense. Sometimes that means a website. Sometimes it is a spreadsheet, a better workflow, or a detail nobody noticed until it worked.</p><dl><div><dt>CURRENT EMPLOYMENT</dt><dd>PT. Wulandari Bangun Laksana<br>February 2026 — Present</dd></div><div><dt>EARLIER EXPERIENCE</dt><dd>IT Support Intern<br>PT. Wulandari Bangun Laksana</dd></div><div><dt>EDUCATION</dt><dd>Bachelor’s Degree<br>Informatics Engineering</dd></div><div><dt>ACADEMIC RESULT</dt><dd>GPA 3.84 / 4.00</dd></div><div><dt>WORKING ACROSS</dt><dd>Web, data, operations,<br>and interface design</dd></div><div><dt>THE APPROACH</dt><dd>Understand the problem.<br>Build something useful.</dd></div></dl><a href="#resume" class="text-li function procurementScores(){
  const minPrice=Math.min(...procurementVendors.map(v=>v.price));
  const minLead=Math.min(...procurementVendors.map(v=>v.lead));
  const maxWarranty=Math.max(...procurementVendors.map(v=>v.warranty));
  const total=Object.values(procurementWeights).reduce((a,b)=>a+b,0)||1;
  return procurementVendors.map(v=>{
    const factors={price:minPrice/v.price*100,lead:minLead/v.lead*100,warranty:v.warranty/maxWarranty*100,compliance:v.compliance};
    const score=Object.keys(factors).reduce((sum,key)=>sum+factors[key]*procurementWeights[key]/total,0);
    return {...v,factors,score};
  }).sort((a,b)=>b.score-a.score);
}

function procurement(){
  const target=$('#workspace');if(!target)return;
  const scores=procurementScores(),weightTotal=Object.values(procurementWeights).reduce((a,b)=>a+b,0),best=scores[0];

      <div class="vendor-recommendation"><span class="eyebrow">CURRENT LEADER</span><strong>${esc(best.name)}</strong><b>${best.score.toFixed(1)} / 100</b><p>Best score with the current decision weights. This is a transparent recommendation, not an automatic purchase approval.</p></div>
    </div>
    ${table(['Rank','Vendor','Quoted total','Lead time','Warranty','Compliance','Tax docs','Weighted score'],scores.map((v,i)=>`<tr class="${i===0?'recommended':''}"><td>0${i+1}</td><td>${esc(v.name)}</td><td>${money(v.price)}</td><td>${v.lead} days</td><td>${v.warranty} months</td><td>${v.compliance}%</td><td>${v.tax?'Complete':'Review'}</td><td><strong>${v.score.toFixed(1)}</strong></td></tr>`).join(''))}

    <p class="calculation">Demonstration Data. Quotes, vendors, prices, and commercial terms are fictional. Change the weights to see how the decision responds.</p>`;

  const form=$('#method-advisor');
  function update(){const f=new FormData(form),goal=f.get('goal'),outcome=f.get('outcome'),count=f.get('count'),paired=f.has('paired');let method,alternative,checks;
    if(goal==='compare'&&outcome==='continuous'){method=count==='2'?(paired?'Paired-samples t-test':'Independent-samples t-test'):(paired?'Repeated-measures ANOVA':'One-way ANOVA');alternative=count==='2'?(paired?'Wilcoxon signed-rank':'Mann–Whitney U'):(paired?'Friedman test':'Kruskal–Wallis');checks='Independence, distribution within groups, outliers, and variance assumptions.';}

    else if(goal==='predict'||count==='many'){method='Multiple linear regression';alternative='Robust regression or a transformed model when assumptions fail';checks='Linearity, residual behavior, influential points, multicollinearity, and model validation.';}
    else if(outcome==='ordinal'){method='Spearman correlation or ordinal regression';alternative='A rank-based group test matched to the design';checks='Ordered coding, monotonic relationship, ties, and proportional odds when using ordinal regression.';}

function citationChecker(){
  const w=$('#research-tool-workspace');
  const startingText='Recent studies describe the importance of clear service processes (Santoso, 2024). Earlier work also highlights response speed (Wijaya, 2023).';
  const startingRefs='Santoso, A. (2024). Service process design. Journal of Demonstration Studies.\nRahman, D. (2022). Operational clarity. Example Press.';
  w.innerHTML=toolkitFrame('06','Check citation and reference consistency.','Paste a short draft and reference list. The checker compares author–year pairs; it does not verify whether a source exists or whether the citation style is correct.',`<form class="citation-form" id="citation-checker"><label>Draft text<textarea name="draft" rows="8">${esc(startingText)}</textarea></label><label>Reference list<textarea name="references" rows="8">${esc(startingRefs)}</textarea></label></form>`);
  const form=$('#citation-checker');function update(){const f=new FormData(form),draft=String(f.get('draft')),refs=String(f.get('references')),citations=[...draft.matchAll(/\(([A-Z][A-Za-zÀ-ÿ'’-]+)(?:\s+et al\.)?,\s*(\d{4}[a-z]?)\)/g)].map(m=>(m[1]+' '+m[2]).toLowerCase()),referencePairs=refs.split('\n').map(line=>{const author=line.trim().match(/^([A-Z][A-Za-zÀ-ÿ'’-]+)/),year=line.match(/\((\d{4}[a-z]?)\)/);return author&&year?(author[1]+' '+year[1]).toLowerCase():null}).filter(Boolean),missing=[...new Set(citations.filter(c=>!referencePairs.includes(c)))],unused=[...new Set(referencePairs.filter(r=>!citations.includes(r)))];$('#tool-result').innerHTML=`<div class="citation-status"><div><strong>${citations.length}</strong><span>citations found</span></div><div><strong>${referencePairs.length}</strong><span>references parsed</span></div><div><strong>${missing.length+unused.length}</strong><span>items to review</span></div></div><div class="citation-findings"><div><h5>Missing from reference list</h5>${missing.length?missing.map(x=>`<span>${esc(x)}</span>`).join(''):'<span>None found</span>'}</div><div><h5>Not cited in this draft</h5>${unused.length?unused.map(x=>`<span>${esc(x)}</span>`).join(''):'<span>None found</span>'}</div></div><p class="tool-caution">Only parenthetical “(Author, 2024)” patterns are checked. Narrative citations, organizations, multiple authors, DOI accuracy, and source authenticity need a full review.</p>`;}
  form.oninput=update;update();
}

function simplePdfBytes(lines){
  const clean=value=>String(value??'').normalize('NFKD').replace(/[^\x20-\x7E]/g,' ').replace(/([\\()])/g,'\\$1');
  const stream=['BT','/F1 15 Tf','55 780 Td'];
  lines.forEach((line,index)=>{if(index){stream.push('0 -28 Td');stream.push(index===2?'/F1 20 Tf':'/F1 10 Tf');}stream.push(`(${clean(line)}) Tj`);});
  stream.push('ET');const content=stream.join('\n');
  const objects=[
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`
  ];
  let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((object,index)=>{offsets.push(pdf.length);pdf+=`${index+1} 0 obj\n${object}\nendobj\n`;});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;offsets.slice(1).forEach(offset=>pdf+=String(offset).padStart(10,'0')+' 00000 n \n');pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new TextEncoder().encode(pdf);
}

  let inventory=[{sku:'NOTE-GRID',name:'Field Notes / Grid',stock:7,reorder:4,cost:39000,price:68000},{sku:'TRAY-GRAPH',name:'Desk Tray / Graphite',stock:3,reorder:4,cost:79000,price:129000},{sku:'BOT-SIGNAL',name:'Bottle / Signal',stock:1,reorder:3,cost:94000,price:158000},{sku:'TOTE-NAT',name:'Canvas Tote / Natural',stock:6,reorder:3,cost:112000,price:184000}];
  let orders=[{id:'SERA-1041',customer:'Maya A.',items:2,total:252000,status:'Paid'},{id:'SERA-1042',customer:'Dion R.',items:1,total:158000,status:'Picking'},{id:'SERA-1043',customer:'Nadia P.',items:3,total:323000,status:'Packed'},{id:'SERA-1044',customer:'R. Putra',items:1,total:129000,status:'Return review'}];
  const statuses=['Paid','Picking','Packed','Shipped'];
  root.innerHTML=demoShell('SERA / OPERATIONS CONSOLE','The work after checkout.','Stock, fulfilment, exceptions, and margin live behind the storefront—not inside another decorative dashboard.',`<div class="ops-console"><nav><button data-ops="orders" aria-pressed="true">Order desk</button><button data-ops="stock" aria-pressed="false">Stock ledger</button><button data-ops="summary" aria-pressed="false">Daily close</button></nav><div id="ops-view"></div></div>`);

  function metrics(){const revenue=orders.filter(o=>o.status!=='Return review').reduce((s,o)=>s+o.total,0),low=inventory.filter(x=>x.stock<=x.reorder).length;return {revenue,low,open:orders.filter(o=>o.status!=='Shipped').length};}

iv><dt>Low-stock SKUs</dt><dd>${m.low}</dd></div><div><dt>Return reviews</dt><dd>${orders.filter(o=>o.status==='Return review').length}</dd></div></dl><button id="ops-export">Export daily summary</button></div>`;bind();}
  function bind(){$$('[data-order-next]').forEach(b=>b.onclick=()=>{const o=orders[Number(b.dataset.orderNext)];if(o.status==='Return review')o.status='Paid';else{const i=statuses.indexOf(o.status);o.status=statuses[Math.min(i+1,statuses.length-1)];}draw();});if($('#stock-post'))$('#stock-post').onclick=()=>{const item=inventory.find(x=>x.sku===$('#stock-sku').value),move=Number($('#stock-movement').value);if(!Number.isFinite(move)||item.stock+move<0){toast('That movement would create invalid stock.');return;}item.stock+=move;toast(`${item.sku}: ${move>0?'+':''}${move} / ${$('#stock-reason').value}`);draw();};if($('#ops-export'))$('#ops-export').onclick=()=>csvDownload('sera-operations-daily-close-demo.csv',[['DEMONSTRATION DATA'],['Order','Customer','Items','Total','Status'],...orders.map(o=>[o.id,o.customer,o.items,o.total,o.status]),[],['SKU','Product','Stock','Reorder point'],...inventory.map(x=>[x.sku,x.name,x.stock,x.reorder])]);}
  $$('[data-ops]').forEach(b=>b.onclick=()=>{view=b.dataset.ops;draw();});draw();
}

  $('#quality-width').oninput=e=>{const width=e.target.value;$('#quality-width-value').textContent=width+' px';$('#quality-frame').style.width=Math.min(width,root.clientWidth)+'px';};$('#quality-run').onclick=run;$('#quality-copy').onclick=()=>navigator.clipboard?.writeText(report).then(()=>toast('Release report copied.')).catch(()=>demoDownload('release-check.txt',report));run();

function weddingCalendar(first,second,value){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return null;
 const clean=s=>String(s).replace(/[\r\n]/g,' ').replaceAll('\\','\\\\').replaceAll(';','\\;').replaceAll(',','\\,');
 const start=new Date(value+'T10:00:00+08:00');if(!Number.isFinite(start.getTime()))return null;
 const stamp=d=>d.toISOString().replace(/[-:]/g,'').replace('.000','');
 return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kevin Studio//Invitation Demo//EN','BEGIN:VEVENT','UID:invitation-demo-'+value+'@kevin-studio','DTSTAMP:'+stamp(new Date()),'DTSTART:'+stamp(start),'DTEND:'+stamp(new Date(start.getTime()+2*3600000)),'SUMMARY:'+clean(first+' & '+second+' — Wedding demo'),'LOCATION:Garden Hall - fictional venue - Balikpapan','DESCRIPTION:Fictional invitation preview. This is not a real event.','END:VEVENT','END:VCALENDAR'].join('\r\n');
}

// Fictional attendance ledger. No network calls or personal information storage.
function attendanceTransition(record,action,time){
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))return {error:'Choose a valid time.'};
 if(action==='in')return record.in?{error:'Already checked in.'}:{record:{...record,in:time,status:time>'09:00'?'Late':'On time'}};
 if(!record.in)return {error:'Check in before checking out.'};
 if(record.out)return {error:'Already checked out.'};
 if(time<=record.in)return {error:'Check-out must be after check-in.'};
 return {record:{...record,out:time}};
}

function translatedText(value){const key=value.trim();let result=siteLanguage==='id'?localeDictionary[key]:null;if(siteLanguage==='id'&&!result){if(/ · Checked (in|out) at /.test(key))result=key.replace('Checked in at','Absen masuk pukul').replace('Checked out at','Absen pulang pukul');else if(/^Page [0-9–]+ of 8$/.test(key))result=key.replace('Page ','Halaman ').replace(' of 8',' dari 8');else if(/^Resume page [0-9]+ ↗$/.test(key))result=key.replace('Resume page ','Lanjutkan halaman ');else if(key.startsWith('Demo reply: ')&&key.endsWith('Nothing was sent.'))result=key.replace('Demo reply: ','Pratinjau: ').replace('Joyfully attending','Dengan senang hati hadir').replace('Unable to attend','Belum bisa hadir').replace('seat(s)','tamu').replace('Nothing was sent.','Tidak ada yang dikirim.');}return result?value.replace(key,result):value;}
function translateInterface(){
 localeObserver.disconnect();document.documentElement.lang=siteLanguage;
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let node;
 while((node=walker.nextNode())){if(node.parentElement.closest('script,style,textarea,[contenteditable],.language-nudge,.language-switch,.admin-page,svg'))continue;
 const last=localeNodes.get(node);const original=last&&node.nodeValue===last.rendered?last.original:node.nodeValue;const rendered=translatedText(original);
 if(node.parentElement.tagName==='OPTION'&&!node.parentElement.hasAttribute('value'))node.parentElement.value=node.parentElement.textContent;
 if(node.nodeValue!==rendered)node.nodeValue=rendered;localeNodes.set(node,{original,rendered});
 }
 document.querySelectorAll('[placeholder],[aria-label]').forEach(el=>{if(el.closest('.language-switch,.language-nudge,.admin-page'))return;let records=localeAttributes.get(el)||{};for(const attr of ['placeholder','aria-label']){if(!el.hasAttribute(attr))continue;const val=el.getAttribute(attr),last=records[attr];const original=last&&val===last.rendered?last.original:val;const rendered=translatedText(original);if(val!==rendered)el.setAttribute(attr,rendered);records[attr]={original,rendered};}localeAttributes.set(el,records);});
 document.querySelectorAll('.wedding-modern').forEach(root=>{const value=root.querySelector('#wed-date')?.value;if(!value)return;const date=new Date(value+'T10:00:00+08:00');if(!Number.isFinite(date.getTime()))return;const label=new Intl.DateTimeFormat(siteLanguage==='id'?'id-ID':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Makassar'}).format(date);root.querySelectorAll('[data-date]').forEach(el=>{if(el.textContent!==label)el.textContent=label;});});
 const select=document.getElementById('site-language');if(select)select.value=siteLanguage;
 localeObserver.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label']});
}
let localePending=false;
const localeObserver=new MutationObserver(()=>{if(localePending)return;localePending=true;setTimeout(()=>{localePending=false;if(document.body)translateInterface();},0);});
function setSiteLanguage(language){siteLanguage=language==='id'?'id':'en';try{localStorage.setItem('portfolio-language',siteLanguage);localStorage.setItem('portfolio-language-seen','1');}catch{}document.querySelector('.language-nudge')?.remove();translateInterface();}
