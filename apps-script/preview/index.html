n and folder boundaries between the interface and Google Drive.","implementation":"Next.js route handlers coordinate Drive API operations. Firebase verifies identity and stores records. Resumable upload helpers, a queue, cache utilities, and download routes separate the main responsibilities.","outcome":"Source inspection confirms archive browsing, upload handling, media endpoints, and administrative routes. The exhibit below is a local simulation using fictional records.","tradeoff":"OAuth credentials and Drive quotas remain external dependencies. A successful interface render alone does not prove every production upload path works.","evidence":["src/lib/drive.ts","src/lib/auth-server.ts","src/lib/resumable-upload.ts","src/app/api/upload/route.ts"],"id":"galilea-digital-archive","featured":true,"order":1,"visibility":"public","updatedAt":"2026-10-22","repositoryUrl":"https://github.com/zvenians/gmahk-galilea-digital-archive","revision":"9a4b68ee28fa13775ad958048b3b412af3d918c9"},{"slug":"majelis-galilea","title":"Less fragmentation.","name":"Majelis Galilea","summary":"Meetings, decisions, budgets, and documents connected through a shared administrative system.","category":"Business Systems","disciplines":["Cloud & APIs","Data & Automation"],"technologies":["JavaScript","Google Apps Script","Google Sheets","Vercel","Google Drive"],"status":"Real Project","visual":"governance","liveUrl":"https://majelis-galilea.vercel.app","challenge":"Administrative work crosses many boundaries: a meeting produces a decision, a decision produces an assignment, and an assignment may affect a budget or document.","approach":"Connect the workflow around shared records and explicit permissions, with a clearer interface for each responsibility.","implementation":"A browser administration shell calls a Vercel proxy and Apps Script business logic. Sheets hold related records; the backend contains role checks and document-generation workflows.","outcome":"The source includes meeting and governance workflows, finance, membership, assets, and official correspondence. No confidential administrative records are reproduced.","tradeoff":"Sheets is familiar to operators, but relational integrity, concurrent edits, and authorization require deliberate application logic.","evidence":["admin/js/core.js","admin/js/features.js","api/gas.js","apps-script/Code.gs","scripts/test-access-boundaries.js"],"id":"majelis-galilea","featured":true,"order":2,"visibility":"public","updatedAt":"2026-10-22","repositoryUrl":"https://github.com/zvenians/majelis-galilea","revision":"748021b9211b0ac2edc45c7fa15d13b5a4235f70"},{"slug":"naomi-rouli","title":"The pace of a story.","name":"Naomi Rouli","summary":"An editorial study in typography, quiet movement, and the space between chapters.","category":"Creative Experiments","disciplines":["UI/UX","Visual Communication"],"technologies":["HTML","CSS","JavaScript","Firebase Hosting"],"status":"Real Project","visual":"editorial","liveUrl":"https://naomirouli.web.app","challenge":"A personal story needs pacing and emotional clarity without turning every screen into another effect.","approach":"Structure the experience into nine scenes. Let typography, composition, and chapter changes carry the narrative.","implementation":"Vanilla JavaScript uses IntersectionObserver for chapter navigation and pointer capture for a horizontal photo rail. CSS custom properties maintain the editorial system.","outcome":"The public repository supports the interaction techniques described here. This exhibit uses an original typographic illustration; private photographs and personal letters are not reused.","tradeoff":"The interface is intentionally bespoke. Reusing its technical patterns is more appropriate than republishing its personal content.","evidence":["script.js","style.css","index.html","firebase.json"],"id":"naomi-rouli","featured":true,"order":3,"visibility":"public","updatedAt":"2026-10-22","repositoryUrl":"https://github.com/zvenians/naomirouli","revision":"486fea3ead595309b8fc1a97d573aa3ec334ec97"},{"slug":"zvenians-exploration","title":"Learning restraint.","name":"Zvenians Web Exploration","summary":"An independent study of product composition, responsive rhythm, and disciplined typography.","category":"Creative Experiments","disciplines":["Web Engineering","UI/UX"],"technologies":["HTML","CSS","JavaScript","GitHub Pages"],"status":"Concept","visual":"exploration","liveUrl":"https://zvenians.github.io","challenge":"Understand how a consistent visual system can support different product stories across a static website.","approach":"Work with type scale, whitespace, full-width compositions, and responsive layouts before adding interaction.","implementation":"Semantic HTML, CSS layout primitives, and lightweight JavaScript. GitHub Pages hosts the static output.","outcome":"An independent educational design exploration, not a commercial engagement or an official Apple website.","tradeoff":"Promotional imagery in the original project is not republished here. This case study focuses on layout techniques.","evidence":["README.md","index.html","mac.html","store.html"],"id":"zvenians-exploration","featured":false,"order":4,"visibility":"public","updatedAt":"2026-10-22","repositoryUrl":"https://github.com/zvenians/zvenians.github.io","revision":"726ef582d4ec955929c58701bcf2cf318a29ce9e"},{"slug":"galilea-origins","title":"Every system starts somewhere.","name":"Galilea Origins","summary":"A historical marker connecting an early idea to the later, dedicated platforms.","category":"Creative Experiments","disciplines":["Web Engineering"],"technologies":["Documentation"],"status":"Historical Prototype","visual":"history","challenge":"The early namespace represents the beginning of a broader church web initiative.","approach":"Keep the historical context visible without counting it as another completed application.","implementation":"At the audited revision, this repository contains a README only. The active implementations live in the three dedicated Galilea repositories.","outcome":"Useful as a timeline marker, not evidence of a functioning prototype.","tradeoff":"No executable application was found in this repository.","evidence":["README.md"],"id":"galilea-origins","featured":false,"order":5,"visibility":"public","updatedAt":"2026-10-22","repositoryUrl":"https://github.com/zvenians/galilea","revision":"b3b1f0a586aefc29fe7b4c2718dd27f0d67ee188"},{"slug":"ruang-temu-booking-demo","title":"Booking, without the back-and-forth.","name":"Ruang Temu — Booking Demo","summary":"A local-service booking demo that helps customers choose a service, pick a time, and send one clear booking summary.","category":"Digital Products","disciplines":["Web Engineering","UI/UX"],"technologies":["JavaScript","Responsive UI","Form Validation","Local State","WhatsApp Flow"],"status":"Interactive Demo","visual":"booking","challenge":"Small businesses often handle bookings through open-ended chat. Customers ask for details one by one, while the owner has to copy schedules and service details by hand.","approach":"Turn the conversation into a simple flow: choose a service, date, and time, then review everything in one place. WhatsApp stays familiar, but the message arrives complete and easier to process.","implementation":"The demo runs locally in the browser with form validation, changing time slots, a booking summary, and clear feedback. Every name, schedule, and transaction is fictional and disconnected from a real business.","outcome":"Visitors can try the booking flow from the first choice to the final summary. It proves the interface logic and responsive behavior; it is not presented as a client production system.","tradeoff":"Payments, customer accounts, a production database, and an owner calendar are intentionally outside this demo. Those features need real operating rules before they should be built.","evidence":["Working service and time-slot selection","Name, date, and contact validation","A booking summary ready to share","Responsive behavior without real business data"],"id":"ruang-temu-booking-demo","featured":true,"order":6,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"sera-goods-commerce-demo","title":"A small shop with serious order logic.","name":"SERA Goods — Commerce Demo","summary":"A detailed storefront demonstration with product discovery, variants, stock-aware cart logic, vouchers, shipping choices, and a clear checkout review.","category":"Digital Products","disciplines":["Web Engineering","Business Systems","UI/UX"],"technologies":["Google Apps Script","Google Sheets","JavaScript","Cart State","Voucher Rules","Shipping Logic"],"status":"Interactive Demo","visual":"commerce","challenge":"A small online shop needs more than attractive product cards. Prices, variants, stock, vouchers, shipping, and order details have to stay consistent from the first browse to the final confirmation.","approach":"Build one short buying flow around the decisions that matter: find a product, choose the right variant, understand the total, and review the order before anything is submitted. Administrative complexity stays behind the storefront.","implementation":"The public exhibit runs as a safe local simulation with a searchable catalogue, category filters, variant-aware stock, quantity controls, voucher validation, configurable shipping, and checkout validation. The production blueprint maps Products, Variants, Vouchers, Shipping, Orders, and Order Items to Google Sheets, with Apps Script rechecking prices and stock before writing an order.","outcome":"Visitors can complete the full storefront journey and inspect the business rules behind it. All products, prices, stock, addresses, vouchers, and order numbers are fictional demonstration data.","tradeoff":"The exhibit does not process payments, contact a courier API, upload real products, or save customer details. A production version would require authenticated administration, Drive media storage, server-side order locking, rate limits, and verified payment or shipping integrations.","evidence":["Searchable and filterable product catalogue","Variant and stock-aware cart calculations","Voucher eligibility and discount limits","Shipping selection and final checkout review","Google Sheets and Apps Script production data model"],"id":"sera-goods-commerce-demo","featured":true,"order":7,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"operations-decision-workbench","title":"A decision should leave a trail.","name":"Operations Decision Workbench","summary":"A procurement and operations demonstration that compares vendor offers with editable weights, transparent formulas, and an exportable decision workbook.","category":"Data & Automation","disciplines":["Data & Automation","Business Systems","Operational Systems"],"technologies":["Excel","Google Sheets","Google Apps Script","Weighted Scoring","Formula Auditing","XLSX Export"],"status":"Interactive Demo","visual":"operations","challenge":"Choosing a supplier from several quotations is rarely a lowest-price decision. Lead time, warranty, documentation, technical compliance, and approval notes need to stay visible without turning the process into an untraceable spreadsheet.","approach":"Keep the decision model small enough to inspect. Each criterion has an explicit weight, every vendor score uses the same normalization rule, and the current recommendation changes as the priorities change.","implementation":"The browser demonstration recalculates four fictional vendor offers in real time. The downloadable Excel workbook separates source quotations, settings, and formula-based scoring so a reviewer can trace the result instead of trusting a fixed dashboard number. The wider Data Lab also includes field validation, maintenance records, reconciliation, scheduling, budgets, and cleanup workflows.","outcome":"Visitors can change the decision weights, compare commercial and technical trade-offs, and download a functioning workbook with editable inputs and formulas. No real vendor, quote, or company record is used.","tradeoff":"Weighted scoring helps structure a review but cannot approve a purchase. A production workflow still needs procurement policy, authorized reviewers, document verification, conflict checks, and controlled access to actual quotations.","evidence":["Editable price, lead-time, warranty, and compliance weights","Normalized multi-criteria vendor scoring","Formula-based XLSX decision workbook","Clear distinction between recommendation and approval"],"id":"operations-decision-workbench","featured":true,"order":8,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"research-practice-toolkit","title":"Research support that shows its reasoning.","name":"Research Practice Toolkit","summary":"Eight local research tools for method selection, sample planning, assumption review, result tables, questionnaire structure, citations, defense practice, and revision tracking.","category":"Data & Automation","disciplines":["Data & Automation","Research Support","Technical Documentation"],"technologies":["SPSS Planning","Statistical Reasoning","JavaScript","CSV Export","Local State","Research Writing"],"status":"Interactive Demo","visual":"researchtools","challenge":"Research support can become vague or irresponsible when it only promises a finished answer. Students need to see how a method connects to a question, what assumptions need attention, and where their own academic judgment is still required.","approach":"Turn the support process into inspectable tools. Each module explains its rule, exposes the inputs, gives a cautious output, and names what it cannot decide. The interface supports learning and revision instead of replacing the student.","implementation":"Eight browser-based modules cover method advising, survey sample estimates, assumption diagnostics, formatted result tables, questionnaire blueprints, author-year consistency checks, defense-question practice, and a locally saved revision plan. Sample exports are generated without uploading research data.","outcome":"Visitors can test a research decision from planning through defense preparation and download selected working files. All examples are fictional, and all generated writing is labeled as a draft for student and supervisor review.","tradeoff":"The toolkit does not run SPSS, verify source authenticity, approve a methodology, write a thesis, fabricate data, or guarantee an academic result. Discipline-specific decisions still require qualified supervision and the student’s own work.","evidence":["Research-method decision helper","Finite-population sample-size calculation","Assumption and influence diagnostics","Questionnaire and result-table CSV exports","Citation consistency review","Defense practice and local revision tracker"],"id":"research-practice-toolkit","featured":true,"order":9,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"asset-field-companion","title":"The network can wait. The observation should not.","name":"Asset Field Companion","summary":"An offline-first field workflow for finding an asset, recording its condition, attaching evidence, and synchronizing a reviewable observation later.","category":"Business Systems","disciplines":["Operational Systems","Web Engineering","Data & Automation"],"technologies":["Progressive Web App","Local Queue","Google Apps Script","Google Sheets","Responsive Forms"],"status":"Interactive Demo","visual":"fieldcompanion","challenge":"Field verification does not always happen beside a reliable connection. A useful tool has to preserve the inventory context, make evidence easy to record on a phone, and show clearly what is local, queued, or synchronized.","approach":"Treat every observation as a small controlled handover. The interface keeps the expected record beside the actual condition, saves work locally first, and lets the operator decide when the queue is ready to synchronize.","implementation":"The demonstration supports asset selection, field condition, observed location, notes, optional photo selection, an offline switch, a persistent local queue, and simulated synchronization. A production version would use a service worker and authenticated Apps Script writes into controlled Sheets and Drive folders.","outcome":"Visitors can complete a realistic mobile field flow and see the difference between a saved observation and a synchronized record. All asset numbers, locations, and departments are fictional.","tradeoff":"The public demo does not upload photos, request precise location, scan a real QR code, or write to production storage. Those capabilities require clear consent, authentication, retention rules, and conflict handling.","evidence":["Persistent browser-local observation queue","Offline and restored-network states","Condition, location, note, and evidence workflow","Explicit sync status and production boundary"],"id":"asset-field-companion","featured":true,"order":10,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"research-data-preparation-studio","title":"Good analysis begins before the Analyze menu.","name":"Research Data Preparation Studio","summary":"A hands-on preparation desk for missing codes, duplicate respondents, reverse scoring, implausible values, codebooks, and SPSS-ready working files.","category":"Data & Automation","disciplines":["Research Support","Data & Automation","Technical Documentation"],"technologies":["SPSS Syntax","CSV Export","Codebook Design","Data Validation","JavaScript"],"status":"Interactive Demo","visual":"dataprep","challenge":"Statistical output can look precise even when the input still contains duplicate IDs, hidden missing-value codes, incorrectly scored items, or impossible values. Those decisions need to be recorded before testing begins.","approach":"Keep the raw import unchanged and create a separate working copy. Every correction is visible in a preparation log, while the codebook explains what each variable means and how it should be treated.","implementation":"The browser tool identifies a duplicate respondent, converts a chosen missing code, optionally reverse-scores Q2R, calculates a scale mean, flags an implausible age, and exports both a prepared CSV and starter SPSS syntax.","outcome":"Visitors can move a small fictional survey from raw rows to a documented analysis-ready copy without uploading anything. The generated files remain editable and clearly labeled as demonstrations.","tradeoff":"The tool does not determine whether a response should be deleted, validate an instrument, replace subject-matter judgment, or open proprietary SPSS files. A real engagement begins with the actual codebook and research protocol.","evidence":["Raw and prepared views remain separate","Missing-code and duplicate handling","Reverse scoring and computed scale mean","CSV, codebook, and SPSS syntax outputs"],"id":"research-data-preparation-studio","featured":true,"order":11,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"document-automation-studio","title":"A document is easier to trust when its source is clear.","name":"Document Automation Studio","summary":"A controlled Sheets-to-document workflow for references, structured fields, draft status, PDF generation, and an archive-ready activity record.","category":"Business Systems","disciplines":["Document Systems","Data & Automation","Workflow Design"],"technologies":["Google Apps Script","Google Sheets","Google Docs","Google Drive","PDF Generation"],"status":"Interactive Demo","visual":"documents","challenge":"Recurring reports and letters are often copied from an old file until their reference, wording, or approval state becomes uncertain. The document needs a dependable source and a visible lifecycle.","approach":"Separate structured data from presentation. A small form supplies the controlled fields, the document preview makes the result inspectable, and the archive log records what would be generated and where it belongs.","implementation":"The demonstration builds four document types from editable inputs, refreshes an A4-style draft, generates a real sample PDF, and exports a compact archive log. The production blueprint maps the same flow to Sheets, Docs templates, Apps Script, and Drive.","outcome":"Visitors can produce a usable fictional report while seeing its reference, draft state, owner, generation date, and archive destination. No confidential company document is reproduced.","tradeoff":"A generated draft is not an approval. Production use still requires authorized templates, access controls, version retention, naming policy, and a clear sign-off process.","evidence":["Structured document input","Controlled A4-style preview","Real client-side PDF output","Archive log with reference and status"],"id":"document-automation-studio","featured":true,"order":12,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"sera-commerce-operations-console","title":"Checkout is only the beginning of the order.","name":"SERA Commerce Operations Console","summary":"The back-office half of the SERA storefront: fulfilment stages, stock movements, reorder signals, return review, margin context, and a daily close.","category":"Digital Products","disciplines":["Business Systems","Web Engineering","Data & Automation"],"technologies":["Inventory Ledger","Order Fulfilment","Google Sheets","Google Apps Script","CSV Export"],"status":"Interactive Demo","visual":"commerceops","challenge":"A polished storefront does not explain what happens after payment. Stock changes, picking, packing, shipping, returns, and end-of-day review need consistent rules behind the public interface.","approach":"Use a compact operations desk instead of another marketing dashboard. Orders move through explicit stages, every stock adjustment has a reason, and low-stock items remain visible during the daily close.","implementation":"The local demonstration advances fictional orders, resolves a return-review exception, posts stock movements with validation, calculates visible gross margin, identifies reorder items, and exports a daily operational record.","outcome":"The original storefront and this console now show both sides of a commerce system: the customer journey and the work required to fulfil it. No order, payment, or customer record leaves the browser.","tradeoff":"The demo has no payment reconciliation, courier webhook, accounting integration, or multi-user stock lock. Those features require verified external services and server-side transactional controls.","evidence":["Order-stage workflow","Validated stock movement ledger","Reorder and gross-margin context","Exportable daily close"],"id":"sera-commerce-operations-console","featured":true,"order":13,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"quality-evidence-room","title":"Quality is a record, not an adjective.","name":"Performance & Accessibility Evidence Room","summary":"A transparent release-review surface for responsive behavior, keyboard safeguards, reduced motion, semantic structure, and clearly bounded evidence.","category":"Creative Experiments","disciplines":["Web Engineering","UI/UX","Technical Documentation"],"technologies":["Accessibility","Responsive Design","Release Checks","Reduced Motion","Progressive Enhancement"],"status":"Interactive Demo","visual":"qualityroom","challenge":"Claims such as fast, responsive, and accessible are easy to write and easy to exaggerate. A credible portfolio should separate what the current page can inspect from what still requires external measurement.","approach":"Present release evidence as a small review room. The visitor can resize a real composition, run document-level checks, copy the result, and read the boundary around performance claims.","implementation":"The tool inspects the live document for a skip link, main landmark, dialog labels, reduced-motion path, keyboard-scrollable tables, stable project URLs, and demonstration disclosure. It deliberately does not invent Lighthouse or Core Web Vitals scores.","outcome":"Visitors see how quality work is documented instead of receiving an unsupported score. The responsive sample also makes layout behavior observable rather than replacing it with screenshots.","tradeoff":"DOM checks cannot replace assistive-technology testing, real-user metrics, slow-network trials, or cross-browser QA. Those results should only be published after the corresponding test has actually run.","evidence":["Live semantic document checks","Responsive width instrument","Copyable release report","Explicit measurement limitations"],"id":"quality-evidence-room","featured":false,"order":14,"visibility":"public","updatedAt":"2026-10-23"},{"slug":"project-brief-scope-builder","title":"A useful brief before a confident estimate.","name":"Project Brief & Scope Builder","summary":"A practical intake tool for websites, data work, research support, and automation—without guessing a price or promising an unreviewed deadline.","category":"Business Systems","disciplines":["Workflow Design","Client Communication","Information Architecture"],"technologies":["Form Validation","Structured Briefs","WhatsApp Handoff","Email Handoff","Local Processing"],"status":"Interactive Demo","visual":"scopebuilder","challenge":"A first message often contains either too little information or a long list of disconnected features. Both make it difficult to understand the actual problem, handover, and boundary.","approach":"Ask only for the choices that improve the first conversation: work area, current stage, working environment, useful deliverables, the immediate problem, and what should stay outside the first scope.","implementation":"The builder changes its handover options by service area, validates the brief, creates a readable summary, copies it to the clipboard, and prepares a WhatsApp or email handoff using the published contact settings. Nothing is stored by the page.","outcome":"A prospective client can arrive with an unclear need and leave with a concise message that Kevin can review. Cost and timing remain discussion points instead of fabricated instant calculations.","tradeoff":"The generated brief is not a contract, proposal, quotation, or technical discovery. Sensitive files should only be shared through an agreed channel after the initial review.","evidence":["Service-specific handover choices","Clear scope-boundary prompt","Copyable structured brief","Contact handoff without public data storage"],"id":"project-brief-scope-builder","featured":false,"order":15,"visibility":"public","updatedAt":"2026-10-23"},{"id":"morph-presentation-studio","slug":"morph-presentation-studio","title":"Give the idea room to move.","name":"Morph Presentation Studio","summary":"An editable slide sequence where the same objects move between layouts—an interactive study of presentation pacing.","category":"Visual Communication","disciplines":["Presentation Design","Motion","Typography"],"technologies":["HTML","CSS Transitions","JavaScript","SVG Export"],"status":"Interactive Demo","visual":"morphslides","featured":false,"order":16,"visibility":"public","updatedAt":"2026-10-25","challenge":"Dense slides make an audience read instead of listen. Movement can clarify the relationship between ideas when it follows the same visual objects.","approach":"Keep three slides connected by one numbered marker, headline, and geometric object. Let visitors change the wording and choose a visual direction before playing the sequence.","implementation":"A browser-local stage changes the layout of persistent DOM elements across three scenes. CSS interpolates their position, scale, shape, and color; reduced-motion removes the tween. Export creates an SVG of the selected frame, not a PowerPoint file.","outcome":"Visitors can edit copy, switch themes, step between slides, autoplay, and download an SVG still. This demonstrates slide direction and Morph-like behavior, not a completed PowerPoint commission.","tradeoff":"Actual PowerPoint Morph animations require an authored .pptx and are not produced by this browser preview. The export is a static SVG frame.","evidence":["Editable copy","Three connected scenes","Reduced-motion support","SVG still export"]},{"id":"identity-mark-studio","slug":"identity-mark-studio","title":"A mark with a point of view.","name":"Identity Mark Studio","summary":"A small, functioning logo workbench: explore structure, weight, contrast, and export a vector concept.","category":"Visual Communication","disciplines":["Logo Design","Visual Identity","Typography"],"technologies":["SVG","JavaScript","Design Systems"],"status":"Interactive Demo","visual":"logostudio","featured":false,"order":17,"visibility":"public","updatedAt":"2026-10-25","challenge":"A useful logo must work as a system, not only as a large image on a moodboard.","approach":"Offer a compact set of structural directions and test each at large and small sizes with deliberate color choices.","implementation":"The browser renders a live SVG from sanitized initials, geometric construction, color, and wordmark. Visitors can switch three directions and download the selected vector as SVG.","outcome":"A usable exploration of logo decisions and scalable output. All names and marks are fictional concepts, not client work or a claim of registered identity.","tradeoff":"This is a concept generator, not a trademark search, final identity strategy, or a substitute for a custom design engagement.","evidence":["Live vector construction","Small-size preview","Three design directions","SVG download"]},{"id":"wedding-invitation-demo","slug":"wedding-invitation-demo","title":"An invitation worth opening.","name":"Wedding Invitation Experience","summary":"A responsive digital wedding invitation with a live design editor, event details, a fictional story, and RSVP simulation.","category":"Visual Communication","disciplines":["Website Design","Invitation Design","Responsive UX"],"technologies":["HTML","CSS","JavaScript","Accessible Forms"],"status":"Interactive Demo","visual":"wedding","featured":false,"order":18,"visibility":"public","updatedAt":"2026-10-25","challenge":"An invitation should feel personal without making guests search for the date, location, or RSVP.","approach":"Lead with the couple, then give the event facts a clear reading order. Keep the guest journey calm on a phone and make every important action available without animation.","implementation":"The demo updates fictional names, date, and visual direction in real time. It shows ceremony and reception details, an illustrative story, and a local RSVP confirmation with input validation. It does not send, store, or publish guest data.","outcome":"Visitors can inspect a responsive invitation flow and try the RSVP safely. This is a fictional demonstration, not a commissioned couple or production guest list.","tradeoff":"A real invitation requires approved photographs, precise event details, delivery and RSVP storage, privacy choices, and an agreed domain or hosting plan.","evidence":["Responsive invitation preview","Live content controls","Accessible RSVP validation","No public guest data storage"]}],"settings":{},"resume":null,"appUrl":"","admin":false};</script><script>"use strict";

function procurementScores(){
  const minPrice=Math.min(...procurementVendors.map(v=>v.price));
  const minLead=Math.min(...procurementVendors.map(v=>v.lead));
  const maxWarranty=Math.max(...procurementVendors.map(v=>v.warranty));
  const total=Object.values(procurementWeights).reduce((a,b)=>a+b,0)||1;
  return procurementVendors.map(v=>{
    const factors={price:minPrice/v.price*100,lead:minLead/v.lead*100,warranty:v.warranty/maxWarranty*100,compliance:v.compliance};
    const score=Object.keys(factors).reduce((sum,key)=>sum+factors[key]*procurementWeights[key]/total,0);
    return {...v,factors,score};
  }).sort((a,b)=>b.score-a.score);
}

function procurement(){
  const target=$('#workspace');if(!target)return;
  const scores=procurementScores(),weightTotal=Object.values(procurementWeights).reduce((a,b)=>a+b,0),best=scores[0];

      <div class="vendor-recommendation"><span class="eyebrow">CURRENT LEADER</span><strong>${esc(best.name)}</strong><b>${best.score.toFixed(1)} / 100</b><p>Best score with the current decision weights. This is a transparent recommendation, not an automatic purchase approval.</p></div>
    </div>
    ${table(['Rank','Vendor','Quoted total','Lead time','Warranty','Compliance','Tax docs','Weighted score'],scores.map((v,i)=>`<tr class="${i===0?'recommended':''}"><td>0${i+1}</td><td>${esc(v.name)}</td><td>${money(v.price)}</td><td>${v.lead} days</td><td>${v.warranty} months</td><td>${v.compliance}%</td><td>${v.tax?'Complete':'Review'}</td><td><strong>${v.score.toFixed(1)}</strong></td></tr>`).join(''))}

    <p class="calculation">Demonstration Data. Quotes, vendors, prices, and commercial terms are fictional. Change the weights to see how the decision responds.</p>`;

  const form=$('#method-advisor');
  function update(){const f=new FormData(form),goal=f.get('goal'),outcome=f.get('outcome'),count=f.get('count'),paired=f.has('paired');let method,alternative,checks;
    if(goal==='compare'&&outcome==='continuous'){method=count==='2'?(paired?'Paired-samples t-test':'Independent-samples t-test'):(paired?'Repeated-measures ANOVA':'One-way ANOVA');alternative=count==='2'?(paired?'Wilcoxon signed-rank':'Mann–Whitney U'):(paired?'Friedman test':'Kruskal–Wallis');checks='Independence, distribution within groups, outliers, and variance assumptions.';}

    else if(goal==='predict'||count==='many'){method='Multiple linear regression';alternative='Robust regression or a transformed model when assumptions fail';checks='Linearity, residual behavior, influential points, multicollinearity, and model validation.';}
    else if(outcome==='ordinal'){method='Spearman correlation or ordinal regression';alternative='A rank-based group test matched to the design';checks='Ordered coding, monotonic relationship, ties, and proportional odds when using ordinal regression.';}

function citationChecker(){
  const w=$('#research-tool-workspace');
  const startingText='Recent studies describe the importance of clear service processes (Santoso, 2024). Earlier work also highlights response speed (Wijaya, 2023).';
  const startingRefs='Santoso, A. (2024). Service process design. Journal of Demonstration Studies.\nRahman, D. (2022). Operational clarity. Example Press.';
  w.innerHTML=toolkitFrame('06','Check citation and reference consistency.','Paste a short draft and reference list. The checker compares author–year pairs; it does not verify whether a source exists or whether the citation style is correct.',`<form class="citation-form" id="citation-checker"><label>Draft text<textarea name="draft" rows="8">${esc(startingText)}</textarea></label><label>Reference list<textarea name="references" rows="8">${esc(startingRefs)}</textarea></label></form>`);
  const form=$('#citation-checker');function update(){const f=new FormData(form),draft=String(f.get('draft')),refs=String(f.get('references')),citations=[...draft.matchAll(/\(([A-Z][A-Za-zÀ-ÿ'’-]+)(?:\s+et al\.)?,\s*(\d{4}[a-z]?)\)/g)].map(m=>(m[1]+' '+m[2]).toLowerCase()),referencePairs=refs.split('\n').map(line=>{const author=line.trim().match(/^([A-Z][A-Za-zÀ-ÿ'’-]+)/),year=line.match(/\((\d{4}[a-z]?)\)/);return author&&year?(author[1]+' '+year[1]).toLowerCase():null}).filter(Boolean),missing=[...new Set(citations.filter(c=>!referencePairs.includes(c)))],unused=[...new Set(referencePairs.filter(r=>!citations.includes(r)))];$('#tool-result').innerHTML=`<div class="citation-status"><div><strong>${citations.length}</strong><span>citations found</span></div><div><strong>${referencePairs.length}</strong><span>references parsed</span></div><div><strong>${missing.length+unused.length}</strong><span>items to review</span></div></div><div class="citation-findings"><div><h5>Missing from reference list</h5>${missing.length?missing.map(x=>`<span>${esc(x)}</span>`).join(''):'<span>None found</span>'}</div><div><h5>Not cited in this draft</h5>${unused.length?unused.map(x=>`<span>${esc(x)}</span>`).join(''):'<span>None found</span>'}</div></div><p class="tool-caution">Only parenthetical “(Author, 2024)” patterns are checked. Narrative citations, organizations, multiple authors, DOI accuracy, and source authenticity need a full review.</p>`;}
  form.oninput=update;update();
}

function simplePdfBytes(lines){
  const clean=value=>String(value??'').normalize('NFKD').replace(/[^\x20-\x7E]/g,' ').replace(/([\\()])/g,'\\$1');
  const stream=['BT','/F1 15 Tf','55 780 Td'];
  lines.forEach((line,index)=>{if(index){stream.push('0 -28 Td');stream.push(index===2?'/F1 20 Tf':'/F1 10 Tf');}stream.push(`(${clean(line)}) Tj`);});
  stream.push('ET');const content=stream.join('\n');
  const objects=[
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`
  ];
  let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((object,index)=>{offsets.push(pdf.length);pdf+=`${index+1} 0 obj\n${object}\nendobj\n`;});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;offsets.slice(1).forEach(offset=>pdf+=String(offset).padStart(10,'0')+' 00000 n \n');pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new TextEncoder().encode(pdf);
}

  let inventory=[{sku:'NOTE-GRID',name:'Field Notes / Grid',stock:7,reorder:4,cost:39000,price:68000},{sku:'TRAY-GRAPH',name:'Desk Tray / Graphite',stock:3,reorder:4,cost:79000,price:129000},{sku:'BOT-SIGNAL',name:'Bottle / Signal',stock:1,reorder:3,cost:94000,price:158000},{sku:'TOTE-NAT',name:'Canvas Tote / Natural',stock:6,reorder:3,cost:112000,price:184000}];
  let orders=[{id:'SERA-1041',customer:'Maya A.',items:2,total:252000,status:'Paid'},{id:'SERA-1042',customer:'Dion R.',items:1,total:158000,status:'Picking'},{id:'SERA-1043',customer:'Nadia P.',items:3,total:323000,status:'Packed'},{id:'SERA-1044',customer:'R. Putra',items:1,total:129000,status:'Return review'}];
  const statuses=['Paid','Picking','Packed','Shipped'];
  root.innerHTML=demoShell('SERA / OPERATIONS CONSOLE','The work after checkout.','Stock, fulfilment, exceptions, and margin live behind the storefront—not inside another decorative dashboard.',`<div class="ops-console"><nav><button data-ops="orders" aria-pressed="true">Order desk</button><button data-ops="stock" aria-pressed="false">Stock ledger</button><button data-ops="summary" aria-pressed="false">Daily close</button></nav><div id="ops-view"></div></div>`);
  let view='orders';
  function metrics(){const revenue=orders.filter(o=>o.status!=='Return review').reduce((s,o)=>s+o.total,0),low=inventory.filter(x=>x.stock<=x.reorder).length;return {revenue,low,open:orders.filter(o=>o.status!=='Shipped').length};}

iv><dt>Low-stock SKUs</dt><dd>${m.low}</dd></div><div><dt>Return reviews</dt><dd>${orders.filter(o=>o.status==='Return review').length}</dd></div></dl><button id="ops-export">Export daily summary</button></div>`;bind();}
  function bind(){$$('[data-order-next]').forEach(b=>b.onclick=()=>{const o=orders[Number(b.dataset.orderNext)];if(o.status==='Return review')o.status='Paid';else{const i=statuses.indexOf(o.status);o.status=statuses[Math.min(i+1,statuses.length-1)];}draw();});if($('#stock-post'))$('#stock-post').onclick=()=>{const item=inventory.find(x=>x.sku===$('#stock-sku').value),move=Number($('#stock-movement').value);if(!Number.isFinite(move)||item.stock+move<0){toast('That movement would create invalid stock.');return;}item.stock+=move;toast(`${item.sku}: ${move>0?'+':''}${move} / ${$('#stock-reason').value}`);draw();};if($('#ops-export'))$('#ops-export').onclick=()=>csvDownload('sera-operations-daily-close-demo.csv',[['DEMONSTRATION DATA'],['Order','Customer','Items','Total','Status'],...orders.map(o=>[o.id,o.customer,o.items,o.total,o.status]),[],['SKU','Product','Stock','Reorder point'],...inventory.map(x=>[x.sku,x.name,x.stock,x.reorder])]);}
  $$('[data-ops]').forEach(b=>b.onclick=()=>{view=b.dataset.ops;draw();});draw();
}

  const root=$('#next-wave-demo');

  $('#quality-width').oninput=e=>{const width=e.target.value;$('#quality-width-value').textContent=width+' px';$('#quality-frame').style.width=Math.min(width,root.clientWidth)+'px';};$('#quality-run').onclick=run;$('#quality-copy').onclick=()=>navigator.clipboard?.writeText(report).then(()=>toast('Release report copied.')).catch(()=>demoDownload('release-check.txt',report));run();

function initImmersion(){
  const html=document.documentElement,header=$('.header');
  if(!$('.living-progress'))document.body.insertAdjacentHTML('afterbegin','<div class="future-atmosphere" aria-hidden="true"><i></i><i></i><i></i><b></b></div><div class="living-progress" aria-hidden="true"></div><div class="living-halo" aria-hidden="true"></div><div class="space-index" aria-hidden="true"><span></span><b>SPACE 00</b><span></span></div>');
  const sections=[...document.querySelectorAll('main section[id]')];
  sections.forEach((section,index)=>{section.classList.add('world-stage');section.dataset.world=String(index).padStart(2,'0');section.style.setProperty('--world-index',index);if(!section.querySelector(':scope > .world-axis'))section.insertAdjacentHTML('afterbegin',`<div class="world-axis" aria-hidden="true"><span>0${index+1}</span><i></i><b>Z ${String((index+1)*12).padStart(3,'0')}</b></div>`);});
  const arrival=$('.arrival');
  if(arrival&&!arrival.querySelector('.arrival-orbit'))arrival.insertAdjacentHTML('afterbegin','<div class="arrival-orbit" aria-hidden="true"><i></i><i></i><i></i><b>KS</b><span>DEPTH / 001</span></div>');
  const rail=$('.space-index');
  if(rail&&sections.length)rail.innerHTML='<span></span><b>SPACE 00</b>'+sections.slice(0,8).map((_,i)=>`<i class="${i===0?'is-current':''}" data-space="${i}"></i>`).join('')+'<span></span>';
  const revealTargets=$$('.section-heading,.exhibit,.workspace,.experiment,.profile-grid,.capability,.connect h2,.connect-actions,.case-copy,.case-visual');
  revealTargets.forEach((el,i)=>{el.classList.add('motion-reveal');el.style.transitionDelay=Math.min(i%4,3)*45+'ms';});
  if(window.__livingObserver)window.__livingObserver.disconnect();
  window.__livingObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');if(entry.target.matches('section[id]'))setCurrentSpace(entry.target,sections);}}),{rootMargin:'-12% 0px -18%',threshold:.08});
  [...sections,...revealTargets].forEach(el=>window.__livingObserver.observe(el));
  initDemoDepth();
  initCreativeLinks();
  initSpatialGallery();
  if(document.body.dataset.immersionBound)return;
  document.body.dataset.immersionBound='true';
  document.addEventListener('visibilitychange',()=>document.body.classList.toggle('tab-idle',document.hidden));
  let frame=0;
  document.addEventListener('pointermove',event=>{if(reduced||event.pointerType==='touch')return;cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const nx=event.clientX/innerWidth-.5,ny=event.clientY/innerHeight-.5;html.style.setProperty('--pointer-x',event.clientX+'px');html.style.setProperty('--pointer-y',event.clientY+'px');html.style.setProperty('--scene-x',nx.toFixed(3));html.style.setProperty('--scene-y',ny.toFixed(3));const stage=event.target.closest('.world-stage');if(stage){const rect=stage.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width,y=Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height));stage.style.setProperty('--world-rx',((.5-y)*2.2).toFixed(2)+'deg');stage.style.setProperty('--world-ry',((x-.5)*3.2).toFixed(2)+'deg');stage.style.setProperty('--world-light',(x*100).toFixed(1)+'% '+(y*100).toFixed(1)+'%');}const arrival=event.target.closest('.arrival');if(arrival){const rect=arrival.getBoundingClientRect();html.style.setProperty('--hero-x',((event.clientX-rect.left)/rect.width-.5).toFixed(3));html.style.setProperty('--hero-y',((event.clientY-rect.top)/rect.height-.5).toFixed(3));}const card=event.target.closest('.exhibit');if(card){const rect=card.getBoundingClientRect();card.style.setProperty('--tilt-x',(((event.clientX-rect.left)/rect.width-.5)*7).toFixed(2));card.style.setProperty('--tilt-y',(((event.clientY-rect.top)/rect.height-.5)*7).toFixed(2));}});});
  document.addEventListener('pointerout',event=>{const card=event.target.closest?.('.exhibit');if(card&&!card.contains(event.relatedTarget)){card.style.removeProperty('--tilt-x');card.style.removeProperty('--tilt-y');}const stage=event.target.closest?.('.world-stage');if(stage&&!stage.contains(event.relatedTarget)){stage.style.setProperty('--world-rx','.25deg');stage.style.setProperty('--world-ry','-.35deg');stage.style.setProperty('--world-light','50% 30%');}});
  let scrollFrame=0;
  const updateScroll=()=>{cancelAnimationFrame(scrollFrame);scrollFrame=requestAnimationFrame(()=>{const max=document.documentElement.scrollHeight-innerHeight,progress=max>0?(scrollY/max)*100:0;html.style.setProperty('--scroll-progress',progress+'%');header?.classList.toggle('is-scrolled',scrollY>24);sections.forEach(section=>{const rect=section.getBoundingClientRect(),center=(rect.top+rect.height/2-innerHeight/2)/Math.max(innerHeight,1);section.style.setProperty('--world-scroll',Math.max(-1,Math.min(1,center)).toFixed(3));});});};
  addEventListener('scroll',updateScroll,{passive:true});updateScroll();
}
function setCurrentSpace(section,sections){
  const index=Math.max(0,sections.indexOf(section)),rail=$('.space-index');
  if(rail){const label=rail.querySelector('b');if(label)label.textContent='SPACE '+String(index).padStart(2,'0');rail.querySelectorAll('i').forEach((dot,i)=>dot.classList.toggle('is-current',i===index));}
  $$('.header nav a').forEach(link=>link.classList.toggle('is-current',link.getAttribute('href')==='#'+section.id));
}

function initDemoDepth(){
  const stages=[...document.querySelectorAll('[data-demo-stage],#booking-demo,#archive-demo,#commerce-demo,.research-toolkit,.data-lab .workspace')];
  stages.forEach((stage,index)=>{
    stage.classList.add('spatial-demo');
    stage.style.setProperty('--stage-index',String(index+1).padStart(2,'0'));
    if(!stage.querySelector(':scope > .spatial-coordinate'))stage.insertAdjacentHTML('afterbegin','<div class="spatial-coordinate" aria-hidden="true"><span>LIVE WORKSPACE</span><b>00 / 00 / 00</b></div>');
    const planeSets=[
      ['.working-demo-head,.commerce-notice,.commerce-store-head,.toolkit-heading,.workspace-heading,.simulation-label','depth-plane depth-plane--label'],
      ['.field-device>aside,.prep-layout>aside,.document-desk>form,.scope-desk>form,.quality-controls,.ops-console>nav,.commerce-toolbar,.commerce-categories,.commerce-checkout>form,.toolkit-tabs,.lab-controls,.archive-controls,.booking-form','depth-plane depth-plane--input'],
      ['.field-device>main,.prep-layout>main,.paper-preview,#scope-output,#quality-frame,#quality-results,#ops-view,.commerce-grid,.commerce-cart,.commerce-order,.toolkit-workspace,.lab-stats,.table-scroll,.calendar,.cleanup>div,.archive-list,.booking-summary','depth-plane depth-plane--output']
    ];
    planeSets.forEach(([selector,names])=>stage.querySelectorAll(selector).forEach(el=>el.classList.add(...names.split(' '))));
    if(stage.dataset.depthBound)return;
    stage.dataset.depthBound='true';
    let frame=0;
    const reset=()=>{stage.style.setProperty('--depth-rx','.55deg');stage.style.setProperty('--depth-ry','-.65deg');stage.style.setProperty('--depth-x','50%');stage.style.setProperty('--depth-y','50%');};
    stage.addEventListener('pointermove',event=>{
      if(reduced||event.pointerType==='touch'||matchMedia('(pointer: coarse)').matches)return;
      const rect=stage.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width,y=(event.clientY-rect.top)/rect.height;
      cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{
        stage.style.setProperty('--depth-rx',((.5-y)*2.2).toFixed(2)+'deg');
        stage.style.setProperty('--depth-ry',((x-.5)*2.8).toFixed(2)+'deg');
        stage.style.setProperty('--depth-x',(x*100).toFixed(1)+'%');
        stage.style.setProperty('--depth-y',(y*100).toFixed(1)+'%');
        const coordinate=stage.querySelector(':scope > .spatial-coordinate b');
        if(coordinate)coordinate.textContent=String(Math.round(x*99)).padStart(2,'0')+' / '+String(Math.round(y*99)).padStart(2,'0')+' / '+String(index+1).padStart(2,'0');
      });
    });
    stage.addEventListener('pointerleave',reset);
    stage.addEventListener('focusin',event=>{stage.classList.add('has-depth-focus');event.target.closest('.depth-plane')?.classList.add('is-depth-active');});
    stage.addEventListener('focusout',event=>{event.target.closest('.depth-plane')?.classList.remove('is-depth-active');if(!stage.contains(event.relatedTarget))stage.classList.remove('has-depth-focus');});
    reset();
  });
}

function admin(){document.body.classList.remove('focus-reading');$('#main').innerHTML=`<article class="admin-page"><span class="eyebrow">OWNER WORKSPACE / GOOGLE APPS SCRIPT</span><h1>Keep it growing.</h1><p>Projects, media, and your current resume. Every write is checked on the server.</p><div class="admin-toolbar"><button id="new-project" class="solid-button">Add a project +</button><a class="text-link" href="${esc(data.databaseUrl)}" target="_blank" rel="noopener">Open content spreadsheet ↗</a><a class="text-link" href="${esc(data.appUrl)}" target="_top">View public site ↗</a><button id="refresh-admin">Refresh content</button></div><div class="admin-panel"><h2>Exhibits</h2><div class="admin-list">${data.projects.map(p=>`<button data-edit="${esc(p.id)}"><span>${esc(p.name)}</span><span>${esc(p.visibility)} · ${p.featured?'Featured · ':''}${p.order} ↗</span></button>`).join('')}</div></div><div id="project-editor"></div><div class="admin-panel"><h2>Resume</h2><p class="admin-help">PDF only, maximum 5 MB. Uploads are private drafts. Publishing exposes the selected PDF through the website; other versions stay private.</p><div class="drop-zone" id="resume-drop"><label for="resume-upload">Choose a PDF or drop it here</label><br><input id="resume-upload" type="file" accept="application/pdf,.pdf"><p id="upload-message" role="status"></p></div><div class="admin-list" style="margin-top:20px">${(data.resumes||[]).map(r=>`<div class="admin-toolbar"><span>${esc(r.name)} · ${esc(String(r.uploadedAt).slice(0,10))} · ${r.published?'PUBLISHED':'DRAFT'}</span><button data-preview-resume="${esc(r.id)}">Preview</button><button data-publish-resume="${esc(r.id)}">${r.published?'Unpublish':'Publish'}</button></div>`).join('')||'<p class="admin-help">No resume uploaded yet.</p>'}</div></div><div class="admin-panel"><h2>Media</h2><p class="admin-help">PNG or JPEG, maximum 4 MB. Uploaded files stay private until attached to a published project.</p><input id="media-upload" type="file" accept="image/png,image/jpeg"><div class="admin-list" style="margin-top:20px">${(data.media||[]).map(m=>`<p>${esc(m.name)} <code>${esc(m.id)}</code></p>`).join('')}</div></div><div class="admin-panel"><h2>Public contact details</h2><p class="admin-help">Only add contact details you want visitors to see. Empty fields remain hidden.</p><form id="settings-form" class="form-grid"><label>Email<input name="email" type="email" value="${esc(data.settings?.email||'')}"></label><label>LinkedIn HTTPS URL<input name="linkedin" type="url" value="${esc(data.settings?.linkedin||'')}"></label><label>WhatsApp, country code and digits<input name="whatsapp" value="${esc(data.settings?.whatsapp||'')}"></label><div><button class="solid-button">Publish contact details</button></div></form></div><div class="admin-panel"><h2>Recent activity</h2>${(data.audit||[]).map(r=>`<p class="admin-help">${esc(r[0])} · ${esc(r[2])} · ${esc(r[3])}</p>`).join('')}</div></article>`;
$('#new-project').onclick=()=>editProject();$$('[data-edit]').forEach(b=>b.onclick=()=>editProject(data.projects.find(p=>p.id===b.dataset.edit)));$('#refresh-admin').onclick=()=>action($('#refresh-admin'),refreshAdmin);$('#resume-upload').onchange=e=>uploadResumeFile(e.target.files[0]);$('#resume-drop').ondragover=e=>e.preventDefault();$('#resume-drop').ondrop=e=>{e.preventDefault();uploadResumeFile(e.dataTransfer.files[0])};$$('[data-preview-resume]').forEach(b=>b.onclick=()=>action(b,async()=>{const f=await rpc('getResumeFile',b.dataset.previewResume);$('#preview-title').textContent=f.name;$('#preview-body').innerHTML=`<iframe class="resume-frame" title="Resume draft preview" src="${fileUrl(f)}"></iframe>`;$('#preview-dialog').showModal()}));$$('[data-publish-resume]').forEach(b=>b.onclick=()=>action(b,async()=>{const r=data.resumes.find(r=>r.id===b.dataset.publishResume);await rpc('publishResume',r.published?'':r.id);await refreshAdmin();toast(r.published?'Resume unpublished.':'Resume published.')}));$('#media-upload').onchange=e=>{const f=e.target.files[0];if(f)action(e.target,async()=>{if(!['image/png','image/jpeg'].includes(f.type)||f.size>4*1024*1024)throw new Error('Choose a PNG or JPEG up to 4 MB.');await rpc('uploadMedia',await readFile(f));await refreshAdmin();toast('Image uploaded. Attach its media ID in a project.');})};$('#settings-form').onsubmit=e=>{e.preventDefault();action(e.submitter,async()=>{const values=Object.fromEntries(new FormData(e.target));data.settings=await rpc('saveSettings',values);toast('Contact details saved.');});};}
async function refreshAdmin(){Object.assign(data,await rpc('getAdminContent'));admin();}
function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,mime:file.type,base64:reader.result.split(',')[1]});reader.onerror=()=>reject(new Error('Could not read this file.'));reader.readAsDataURL(file);});}
async function uploadResumeFile(file){if(!file)return;const message=$('#upload-message');try{if(file.type!=='application/pdf'||file.size>5*1024*1024)throw new Error('Choose a PDF up to 5 MB.');message.textContent='Uploading draft…';$('#resume-upload').disabled=true;await rpc('uploadResume',await readFile(file));await refreshAdmin();toast('PDF uploaded as a private draft. Preview it before publishing.');}catch(e){message.textContent=e.message;$('#resume-upload').disabled=false;}}
function editProject(existing){const p=existing||{id:'',slug:'',name:'',title:'',summary:'',category:'Digital Products',disciplines:[],technologies:[],status:'Concept',visual:'archive',featured:false,order:data.projects.length,visibility:'draft',updatedAt:'',challenge:'',approach:'',implementation:'',outcome:'',tradeoff:'',evidence:[]};const textFields=[['id','Stable project ID'],['slug','URL slug'],['name','Project name'],['title','Editorial headline'],['category','Category'],['repositoryUrl','Repository HTTPS URL'],['liveUrl','Live HTTPS URL'],['coverUrl','Optional public image HTTPS URL'],['mediaId','Uploaded media ID'],['revision','Evidence commit SHA']];$('#project-editor').innerHTML=`<div class="admin-panel"><h2>${existing?'Edit exhibit':'A new exhibit'}</h2><form id="project-form" class="form-grid">${textFields.map(([k,label])=>`<label>${label}<input name="${k}" value="${esc(p[k]||'')}" ${['id','slug','name','title','category'].includes(k)?'required':''} ${existing&&k==='id'?'readonly':''}></label>`).join('')}${[['visibility',['draft','public','private']],['status',['Real Project','Interactive Demo','Case Study','Concept','Historical Prototype','In Progress']],['visual',['portal','archive','governance','editorial','exploration','history','booking','commerce']]].map(([k,options])=>`<label>${k}<select name="${k}">${options.map(v=>`<option ${p[k]===v?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}<label>Order<input name="order" type="number" value="${p.order}"></label><label>Featured<input name="featured" type="checkbox" ${p.featured?'checked':''}></label>${['disciplines','technologies'].map(k=>`<label>${k}, comma-separated<input name="${k}" value="${esc(p[k].join(', '))}"></label>`).join('')}${['summary','challenge','approach','implementation','outcome','tradeoff'].map(k=>`<label class="wide">${k}<textarea name="${k}" required maxlength="6000">${esc(p[k])}</textarea></label>`).join('')}<label class="wide">Evidence file paths, one per line<textarea name="evidence">${esc(p.evidence.join('\n'))}</textarea></label><div class="wide admin-toolbar"><button class="solid-button" type="submit">Save ${p.visibility==='public'?'published exhibit':'changes'}</button><button type="button" id="preview-exhibit">Preview layout</button><button type="button" id="cancel-editor">Close editor</button></div><p class="admin-help wide">Published projects appear automatically in the index. Draft and private entries are excluded from public responses. Changing a slug changes its URL.</p></form></div>`;$('#project-editor').scrollIntoView({behavior:'smooth'});function payload(){const f=new FormData($('#project-form'));const q={...p,...Object.fromEntries(f)};q.featured=f.has('featured');q.order=Number(q.order);['disciplines','technologies'].forEach(k=>q[k]=q[k].split(',').map(s=>s.trim()).filter(Boolean));q.evidence=q.evidence.split('\n').map(s=>s.trim()).filter(Boolean);['repositoryUrl','liveUrl','coverUrl','mediaId','revision'].forEach(k=>{if(!q[k])delete q[k]});return q;}$('#project-form').onsubmit=e=>{e.preventDefault();action(e.submitter,async()=>{await rpc('saveProject',payload());await refreshAdmin();toast('Exhibit saved.');})};$('#preview-exhibit').onclick=()=>{const q=payload();$('#preview-title').textContent=q.name||'Untitled exhibit';$('#preview-body').innerHTML=visual(q)+`<h3 style="margin:20px 0">${esc(q.title)}</h3><p>${esc(q.summary)}</p><p class="admin-help">Local preview. No changes have been saved.</p>`;$('#preview-dialog').showModal();hydrateMedia()};$('#cancel-editor').onclick=()=>$('#project-editor').innerHTML='';}
const editProjectBase=editProject;
editProject=function(existing){editProjectBase(existing);const select=$('#project-form select[name="visual"]');if(!select)return;['operations','researchtools','fieldcompanion','dataprep','documents','commerceops','qualityroom','scopebuilder'].forEach(value=>{if(!select.querySelector(`option[value="${value}"]`)){const option=document.createElement('option');option.value=value;option.textContent=value;select.appendChild(option);}});select.value=existing?.visual||select.value;};
if(data.projectSlug&&!location.hash&&window.INDEX_HOSTED){current='project';casePage(data.projectSlug);document.title=(data.projects.find(p=>p.slug===data.projectSlug)?.name||'Exhibit')+' — Kevin Simatupang';requestAnimationFrame(initImmersion);}else if(data.projectSlug&&!location.hash)location.hash='project/'+data.projectSlug;else route();
})();
</script></body></html>
